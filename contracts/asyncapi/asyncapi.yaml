        required:
        - scheme_id
        - type
        type: object
      - description: A SKOS concept was created.
        properties:
          concept_id:
            format: uuid
            type: string
          scheme_id:
            format: uuid
            type:
            - string
            - 'null'
          type:
            enum:
            - ConceptCreated
            type: string
        required:
        - concept_id
        - type
        type: object
      - description: A SKOS concept was updated.
        properties:
          concept_id:
            format: uuid
            type: string
          type:
            enum:
