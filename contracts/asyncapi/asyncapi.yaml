    parameters:
      entity_id:
        description: Filter events to a specific entity ID
      memory:
        description: 'Memory archive to scope events to (default: all archives)'
      token:
        description: Bearer token for authentication (alternative to Authorization header)
      types:
        description: Comma-separated list of event types to subscribe to (e.g., `note.created,note.updated`)
components:
  schemas:
    EventActor:
      description: |-
        Actor metadata for event attribution.

        Identifies who or what caused an event — system processes, authenticated users, or AI agents.
      properties:
        id:
          description: Optional actor identifier (user ID, API key ID, agent name).
          type:
          - string
          - 'null'
        kind:
          description: 'Actor type: `"system"`, `"user"`, or `"agent"`.'
          type: string
        name:
          description: Optional display name.
          type:
          - string
          - 'null'
      required:
      - kind
      title: EventActor
      type: object
    EventEnvelope:
      description: |-
        Versioned server event envelope conforming to the Fortemi SSE contract.

        All SSE emissions use this envelope. The `event_type` field uses dot-namespaced names (e.g., `"note.updated"`, `"job.started"`). The `payload` contains the domain-specific event data.

        ## Wire Format (SSE)

        ```text event: note.updated id: 019508a0-1234-7def-8000-abcdef123456 data: {"event_id":"...","event_type":"note.updated","occurred_at":"...","actor":{...},"payload":{...}} ```

        ## Schema Evolution

        - `payload_version` starts at `1` and increments on breaking payload changes. - New optional fields may be added to the envelope without version bump. - Consumers should ignore unknown fields (forward compatibility). - Breaking changes require a new `payload_version` with deprecation window.
      properties:
        actor:
          allOf:
          - $ref: '#/components/schemas/EventActor'
          description: Who/what caused this event.
        causation_id:
          description: ID of the event that caused this event.
          format: uuid
          type:
          - string
          - 'null'
        correlation_id:
          description: Correlation ID for tracing related events.
          format: uuid
          type:
          - string
          - 'null'
        entity_id:
          description: ID of the entity this event relates to.
          type:
          - string
          - 'null'
        entity_type:
          description: Type of entity this event relates to (e.g., `"note"`, `"job"`).
          type:
          - string
          - 'null'
        event_id:
          description: Unique event identifier (UUIDv7 for temporal ordering).
          format: uuid
          type: string
        event_type:
          description: Namespaced event type (e.g., `"note.updated"`, `"job.started"`).
          type: string
        memory:
          description: Memory/archive scope. None for system-wide events.
          type:
          - string
          - 'null'
        occurred_at:
          description: When the event occurred (UTC).
          format: date-time
          type: string
        payload:
          allOf:
          - $ref: '#/components/schemas/ServerEvent'
          description: Domain-specific event data.
        payload_version:
          description: Payload schema version (for forward/backward compatibility).
          format: uint32
          minimum: 0.0
          type: integer
        tenant_id:
          description: Tenant identifier (if multi-tenant).
          type:
          - string
          - 'null'
      required:
      - actor
      - event_id
      - event_type
      - occurred_at
      - payload
      - payload_version
      title: EventEnvelope
      type: object
    EventPriority:
      description: |-
        Event priority for backpressure decisions (Issue #458).

        Critical events (domain mutations) are never coalesced or dropped. Normal events (job lifecycle) are delivered in order but may be dropped under lag. Low events (telemetry, progress) may be coalesced or dropped to protect stream stability.
      oneOf:
      - description: Domain mutations — never coalesced or dropped.
        enum:
        - Critical
        type: string
      - description: Job lifecycle — delivered in order, dropped only under severe lag.
        enum:
        - Normal
        type: string
      - description: Telemetry and progress — may be coalesced within time windows.
        enum:
        - Low
        type: string
      title: EventPriority
    ServerEvent:
      description: |-
        Unified server event type matching the HotM WebSocket client protocol.

        These events are serialized as JSON with a `type` tag field, e.g.: `{"type":"JobStarted","job_id":"...","job_type":"Embedding"}`

        When wrapped in an [`EventEnvelope`], these become the `payload` field.
      oneOf:
      - description: Periodic queue statistics broadcast.
        properties:
          pending:
            format: int64
            type: integer
          running:
            format: int64
            type: integer
          total_jobs:
            format: int64
            type: integer
          type:
            enum:
            - QueueStatus
            type: string
        required:
        - pending
        - running
        - total_jobs
        - type
        type: object
      - description: A job was added to the queue.
        properties:
          job_id:
            format: uuid
            type: string
          job_type:
            type: string
          note_id:
            format: uuid
            type:
            - string
            - 'null'
          type:
            enum:
            - JobQueued
            type: string
        required:
        - job_id
        - job_type
        - type
        type: object
      - description: A job started processing.
        properties:
          job_id:
            format: uuid
            type: string
          job_type:
            type: string
          note_id:
            format: uuid
            type:
            - string
            - 'null'
          type:
            enum:
            - JobStarted
            type: string
        required:
        - job_id
        - job_type
        - type
        type: object
      - description: Job progress update.
        properties:
          job_id:
            format: uuid
            type: string
          message:
            type:
            - string
            - 'null'
          note_id:
            format: uuid
            type:
            - string
            - 'null'
          progress:
            format: int32
            type: integer
          type:
            enum:
            - JobProgress
            type: string
        required:
        - job_id
        - progress
        - type
        type: object
      - description: A job completed successfully.
        properties:
          duration_ms:
            format: int64
            type:
            - integer
            - 'null'
          job_id:
            format: uuid
            type: string
          job_type:
            type: string
          note_id:
            format: uuid
            type:
            - string
            - 'null'
          type:
            enum:
            - JobCompleted
            type: string
        required:
        - job_id
        - job_type
        - type
        type: object
      - description: A job failed.
        properties:
          error:
            type: string
          job_id:
            format: uuid
            type: string
          job_type:
            type: string
          note_id:
            format: uuid
            type:
            - string
            - 'null'
          type:
            enum:
            - JobFailed
            type: string
        required:
        - error
        - job_id
        - job_type
        - type
        type: object
      - description: A note was created, updated, or had its AI content refreshed.
        properties:
          has_ai_content:
            type: boolean
          has_links:
            type: boolean
          note_id:
            format: uuid
            type: string
          tags:
            items:
              type: string
            type: array
          title:
            type:
            - string
            - 'null'
          type:
            enum:
            - NoteUpdated
            type: string
        required:
        - has_ai_content
        - has_links
        - note_id
        - tags
        - type
        type: object
      - description: A new note was created.
        properties:
          note_id:
            format: uuid
            type: string
          tags:
            items:
              type: string
            type: array
          title:
            type:
            - string
            - 'null'
          type:
            enum:
            - NoteCreated
            type: string
        required:
        - note_id
        - tags
        - type
        type: object
      - description: A note was soft-deleted.
        properties:
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - NoteDeleted
            type: string
        required:
        - note_id
        - type
        type: object
      - description: A note was archived.
        properties:
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - NoteArchived
            type: string
        required:
        - note_id
        - type
        type: object
      - description: A note was restored from archive or soft-deletion.
        properties:
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - NoteRestored
            type: string
        required:
        - note_id
        - type
        type: object
      - description: Tags on a note were changed (added, removed, or replaced).
        properties:
          note_id:
            format: uuid
            type: string
          tags:
            items:
              type: string
            type: array
          type:
            enum:
            - NoteTagsUpdated
            type: string
        required:
        - note_id
        - tags
        - type
        type: object
      - description: Semantic links on a note were updated (by background linking job).
        properties:
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - NoteLinksUpdated
            type: string
        required:
        - note_id
        - type
        type: object
      - description: An AI revision was created for a note.
        properties:
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - NoteRevisionCreated
            type: string
        required:
        - note_id
        - type
        type: object
      - description: A file attachment was uploaded to a note.
        properties:
          attachment_id:
            format: uuid
            type: string
          filename:
            type:
            - string
            - 'null'
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - AttachmentCreated
            type: string
        required:
        - attachment_id
        - note_id
        - type
        type: object
      - description: A file attachment was deleted.
        properties:
          attachment_id:
            format: uuid
            type: string
          note_id:
            format: uuid
            type:
            - string
            - 'null'
          type:
            enum:
            - AttachmentDeleted
            type: string
        required:
        - attachment_id
        - type
        type: object
      - description: Extraction metadata for an attachment was updated (content, document type, EXIF).
        properties:
          attachment_id:
            format: uuid
            type: string
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - AttachmentExtractionUpdated
            type: string
        required:
        - attachment_id
        - note_id
        - type
        type: object
      - description: A collection was created.
        properties:
          collection_id:
            format: uuid
            type: string
          name:
            type: string
          type:
            enum:
            - CollectionCreated
            type: string
        required:
        - collection_id
        - name
        - type
        type: object
      - description: A collection was updated (name or description changed).
        properties:
          collection_id:
            format: uuid
            type: string
          name:
            type: string
          type:
            enum:
            - CollectionUpdated
            type: string
        required:
        - collection_id
        - name
        - type
        type: object
      - description: A collection was deleted.
        properties:
          collection_id:
            format: uuid
            type: string
          type:
            enum:
            - CollectionDeleted
            type: string
        required:
        - collection_id
        - type
        type: object
      - description: A note was moved into or out of a collection.
        properties:
          collection_id:
            format: uuid
            type:
            - string
            - 'null'
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - CollectionMembershipChanged
            type: string
        required:
        - note_id
        - type
        type: object
      - description: A memory archive was created.
        properties:
          archive_id:
            format: uuid
            type:
            - string
            - 'null'
          name:
            type: string
          type:
            enum:
            - ArchiveCreated
            type: string
        required:
        - name
        - type
        type: object
      - description: A memory archive was updated.
        properties:
          name:
            type: string
          type:
            enum:
            - ArchiveUpdated
            type: string
        required:
        - name
        - type
        type: object
      - description: A memory archive was deleted.
        properties:
          name:
            type: string
          type:
            enum:
            - ArchiveDeleted
            type: string
        required:
        - name
        - type
        type: object
      - description: The default memory archive was changed.
        properties:
          name:
            type: string
          type:
            enum:
            - ArchiveDefaultChanged
            type: string
        required:
        - name
        - type
        type: object
      - description: A SKOS concept scheme was created.
        properties:
          scheme_id:
            format: uuid
            type: string
          type:
            enum:
            - ConceptSchemeCreated
            type: string
        required:
        - scheme_id
        - type
        type: object
      - description: A SKOS concept scheme was updated.
        properties:
          scheme_id:
            format: uuid
            type: string
          type:
            enum:
            - ConceptSchemeUpdated
            type: string
        required:
        - scheme_id
        - type
        type: object
      - description: A SKOS concept scheme was deleted.
        properties:
          scheme_id:
            format: uuid
            type: string
          type:
