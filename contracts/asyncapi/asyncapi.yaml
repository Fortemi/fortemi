            format: uuid
            type: string
          type:
            enum:
            - IndexEmbeddingUpdated
            type: string
        required:
        - note_id
        - type
        type: object
      - description: Semantic links for a note were updated by the linking pipeline.
        properties:
          job_id:
            format: uuid
            type:
            - string
            - 'null'
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - IndexLinkingUpdated
            type: string
        required:
        - note_id
        - type
        type: object
      - description: Full-text search index for a note was updated.
        properties:
          job_id:
            format: uuid
            type:
            - string
            - 'null'
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - IndexFtsUpdated
            type: string
        required:
        - note_id
        - type
        type: object
      - description: The knowledge graph read model was updated.
        properties:
          note_id:
            format: uuid
            type:
            - string
            - 'null'
          type:
            enum:
            - ReadmodelGraphUpdated
            type: string
        required:
        - type
        type: object
      - description: All derived views for a note are ready for search.
        properties:
          note_id:
            format: uuid
            type: string
          type:
            enum:
            - ReadmodelSearchReady
            type: string
        required:
        - note_id
        - type
        type: object
      - description: The inference provider's reachability state changed (e.g. Ollama came online or went offline). Emitted by the periodic reachability probe so clients can clear or raise an "offline mode" indicator without polling `/health`.
        properties:
          available:
            type: boolean
          type:
            enum:
            - InferenceAvailabilityChanged
            type: string
        required:
        - available
        - type
        type: object
      - description: |-
          An operator changed the inference configuration via `POST /api/v1/inference/config` or `DELETE /api/v1/inference/config`. Lets reactive UIs (HotM provider pill, MCP-tool clients, dashboards) update their picture of the active provider without polling `GET /api/v1/inference/config`.

          The payload deliberately excludes API keys and any field that could leak credentials. `changed_fields` carries dotted field names like `"openrouter.api_key"` so clients can render targeted UI without receiving the value itself.
        properties:
          changed_fields:
            description: 'Dotted field names that changed in this config update. Examples: `["openrouter.api_key", "openrouter.generation_model"]`, `["embedding_backend"]`, `["__reset__"]` for `DELETE` events.'
            items:
              type: string
            type: array
          default_backend:
            description: Active default backend id after the change (e.g. `"ollama"`).
            type: string
          embedding_backend:
            description: Active embedding-route override id, when set independently of the default. `None` means embeddings flow through `default_backend`.
            type:
            - string
            - 'null'
          type:
            enum:
            - InferenceConfigChanged
            type: string
        required:
        - changed_fields
        - default_backend
        - type
        type: object
      title: ServerEvent
info:
  description: Real-time server-sent events (SSE) for the Fortemi knowledge base. Connect to `/api/v1/events` to receive domain events as they occur.
  license:
    name: BSL-1.1
    url: https://github.com/fortemi/fortemi/blob/main/LICENSE
  title: Fortemi Event Stream
  version: 2026.7.25
operations:
  receiveEvents:
    action: receive
    channel:
      $ref: '#/channels/events'
    description: Subscribe to the event stream. Events are delivered as SSE `data:` frames with JSON payloads wrapped in an EventEnvelope.
    messages:
    - $ref: '#/channels/events/messages/QueueStatus'
    - $ref: '#/channels/events/messages/JobQueued'
    - $ref: '#/channels/events/messages/JobStarted'
    - $ref: '#/channels/events/messages/JobProgress'
    - $ref: '#/channels/events/messages/JobCompleted'
    - $ref: '#/channels/events/messages/JobFailed'
    - $ref: '#/channels/events/messages/NoteUpdated'
    - $ref: '#/channels/events/messages/NoteCreated'
    - $ref: '#/channels/events/messages/NoteDeleted'
    - $ref: '#/channels/events/messages/NoteArchived'
    - $ref: '#/channels/events/messages/NoteRestored'
    - $ref: '#/channels/events/messages/NoteTagsUpdated'
    - $ref: '#/channels/events/messages/NoteLinksUpdated'
    - $ref: '#/channels/events/messages/NoteRevisionCreated'
    - $ref: '#/channels/events/messages/AttachmentCreated'
    - $ref: '#/channels/events/messages/AttachmentDeleted'
    - $ref: '#/channels/events/messages/AttachmentExtractionUpdated'
    - $ref: '#/channels/events/messages/CollectionCreated'
    - $ref: '#/channels/events/messages/CollectionUpdated'
    - $ref: '#/channels/events/messages/CollectionDeleted'
    - $ref: '#/channels/events/messages/CollectionMembershipChanged'
    - $ref: '#/channels/events/messages/ArchiveCreated'
    - $ref: '#/channels/events/messages/ArchiveUpdated'
    - $ref: '#/channels/events/messages/ArchiveDeleted'
    - $ref: '#/channels/events/messages/ArchiveDefaultChanged'
    - $ref: '#/channels/events/messages/ConceptSchemeCreated'
    - $ref: '#/channels/events/messages/ConceptSchemeUpdated'
    - $ref: '#/channels/events/messages/ConceptSchemeDeleted'
    - $ref: '#/channels/events/messages/ConceptCreated'
    - $ref: '#/channels/events/messages/ConceptUpdated'
    - $ref: '#/channels/events/messages/ConceptDeleted'
    - $ref: '#/channels/events/messages/ConceptRelationsUpdated'
    - $ref: '#/channels/events/messages/ConceptSchemeChanged'
