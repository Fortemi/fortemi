            type: string
          type:
            enum:
            - JobsPaused
            type: string
        required:
        - scope
        - type
        type: object
      - description: Job processing was resumed (globally or for a specific archive).
        properties:
          scope:
            description: '`"global"` or the archive name that was resumed.'
            type: string
          type:
            enum:
            - JobsResumed
            type: string
