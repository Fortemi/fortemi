[package]
name = "fortemi-auth-consumer-conformance"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace]

[dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
chrono = { version = "0.4.44", features = ["clock"] }
fortemi-auth-axum = { version = "=0.1.0", git = "https://git.integrolabs.net/Fortemi/fortemi-auth.git", tag = "v0.1.0" }
fortemi-auth-clerk = { version = "=0.1.0", git = "https://git.integrolabs.net/Fortemi/fortemi-auth.git", tag = "v0.1.0" }
fortemi-auth-core = { version = "=0.1.0", git = "https://git.integrolabs.net/Fortemi/fortemi-auth.git", tag = "v0.1.0" }
fortemi-auth-mock = { version = "=0.1.0", git = "https://git.integrolabs.net/Fortemi/fortemi-auth.git", tag = "v0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }
xjp-oidc = "=1.1.0"

[[test]]
name = "consumer_smoke"
path = "tests/consumer_smoke.rs"
