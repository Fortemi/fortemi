---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fortemi-api
  labels:
    app.kubernetes.io/name: fortemi
    app.kubernetes.io/instance: fortemi
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fortemi-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fortemi-worker
  labels:
    app.kubernetes.io/name: fortemi
    app.kubernetes.io/instance: fortemi
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fortemi-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
