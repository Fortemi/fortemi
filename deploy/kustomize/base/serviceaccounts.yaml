---
# One ServiceAccount for the API, worker and MCP pods, one for the migration
# Job, matching the chart. Neither mounts a Kubernetes API token: Fortémi makes
# no API-server calls. Workload identity (IRSA or EKS Pod Identity, e.g. for
# AWS KMS in hosted mode) is added by the overlay as an annotation patch; IRSA's
# projected token is injected by its webhook regardless of this setting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortemi
  labels:
    app.kubernetes.io/name: fortemi
    app.kubernetes.io/instance: fortemi
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortemi-migrate
  labels:
    app.kubernetes.io/name: fortemi
    app.kubernetes.io/instance: fortemi
    app.kubernetes.io/component: migrate
automountServiceAccountToken: false
