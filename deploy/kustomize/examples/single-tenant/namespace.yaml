---
# Fortémi in its own namespace under the restricted Pod Security Standard: the
# server and MCP images run as uid 1000 with a read-only root, no capabilities
# and RuntimeDefault seccomp, so nothing here needs `baseline`. (The all-in-one
# bundle image is different: it runs as root and is not this base.)
apiVersion: v1
kind: Namespace
metadata:
  name: fortemi
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
