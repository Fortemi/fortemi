# Default values for the Fortémi chart.
#
# The chart never creates Secret values. Every credential (database URLs, Redis
# URLs, MCP OAuth client) is read from a Secret you create beforehand; values only
# name the Secret and key. See docs/deployment/kubernetes-helm.md.

nameOverride: ""
fullnameOverride: ""

# Server image: one image runs the API, the job worker and the migration Job.
# The role is selected per Deployment (WORKER_ENABLED, `--migrate-only`).
image:
  repository: ghcr.io/fortemi/fortemi
  # Defaults to .Chart.AppVersion. Prefer pinning `digest` in production.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ---------------------------------------------------------------------------
# External dependencies (never deployed by this chart)
# ---------------------------------------------------------------------------
database:
  # Secret holding the runtime DATABASE_URL (required).
  existingSecret: fortemi-database
  urlKey: DATABASE_URL
  # Optional privileged migration connection (MIGRATION_DATABASE_URL). Required
  # when env.FORTEMI_MULTI_TENANT is "true". Leave existingSecret empty to run
  # migrations with DATABASE_URL (Community Edition single role).
  migration:
    existingSecret: ""
    urlKey: MIGRATION_DATABASE_URL
    # Hosted startup still requires MIGRATION_DATABASE_URL in API/worker pods
    # (the binary runs an idempotent migration check at boot). Set false only
    # for Community Edition deployments that do not need it at runtime.
    exposeToRuntime: true

redis:
  # General cache (REDIS_ENABLED / REDIS_URL).
  enabled: false
  existingSecret: ""
  urlKey: REDIS_URL
  # Hosted shared admission quota (FORTEMI_QUOTA_REDIS_URL), required when
  # env.FORTEMI_MULTI_TENANT is "true".
  quota:
    existingSecret: ""
    urlKey: FORTEMI_QUOTA_REDIS_URL

# Plain (non-secret) environment applied to API, worker and migration pods.
# Names are the documented variables in docs/content/configuration.md.
env:
  RUST_LOG: info
  LOG_FORMAT: json
  # Explicit Community Edition default; the migration Job reads the same value.
  FORTEMI_MULTI_TENANT: "false"
  REQUIRE_AUTH: "true"
  # ISSUER_URL: https://memory.example.com
  # FORTEMI_ATTACHMENTS_ENABLED: "true"
  MATRIC_ATTACHMENT_SCAN_MODE: disabled

# Extra env entries (full EnvVar objects, e.g. secretKeyRef) for server pods.
extraEnv: []
extraEnvFrom: []

# Additional trust roots for the external OIDC issuer, mounted read-only and
# exported as FORTEMI_AUTH_CA_BUNDLE. The ConfigMap must already exist.
authCaBundle:
  configMap: ""
  key: ca.pem
  mountPath: /etc/fortemi/trust/oidc

# Attachment file storage (FILE_STORAGE_PATH). API and worker must share it,
# so multi-replica deployments need a ReadWriteMany claim. emptyDir is only
# suitable for a single pod or with FORTEMI_ATTACHMENTS_ENABLED=false.
fileStorage:
  path: /var/lib/matric/files
  existingClaim: ""

extraVolumes: []
extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Migrations: pre-install,pre-upgrade hook Job running `matric-api --migrate-only`
# ---------------------------------------------------------------------------
migrations:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # The hook runs before regular resources exist, so it uses its own hook-scoped
  # ServiceAccount (annotations default to serviceAccount.annotations).
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# ---------------------------------------------------------------------------
# Workloads
# ---------------------------------------------------------------------------
api:
  replicaCount: 2
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 3000
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

worker:
  enabled: true
  replicaCount: 1
  # Worker pods serve /livez and /readyz on this port for probes only; no
  # Service or Ingress routes traffic to them.
  port: 3000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Independent of api.autoscaling.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  # Long jobs (extraction, embedding) get time to finish on SIGTERM.
  terminationGracePeriodSeconds: 120
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

mcp:
  enabled: true
  # Built from Dockerfile.mcp and published by release CI as a linux/amd64 +
  # linux/arm64 index (ghcr.io/fortemi/fortemi-mcp:<version>). Pin the digest.
  image:
    repository: ghcr.io/fortemi/fortemi-mcp
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 3001
  # Public URL of the MCP endpoint, e.g. https://memory.example.com/mcp
  baseUrl: ""
  basePath: /mcp
  toolMode: core
  # Secret with the MCP OAuth client (registered via POST /oauth/register).
  oauthClient:
    existingSecret: ""
    clientIdKey: MCP_CLIENT_ID
    clientSecretKey: MCP_CLIENT_SECRET
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
    port: 3001
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Identity and security
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  # Workload identity, e.g. IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
  # EKS Pod Identity needs no annotation (association is made in EKS).
  annotations: {}
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

probes:
  liveness:
    path: /livez
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 10
    failureThreshold: 3
  # Startup covers boot-time migration checks and the KMS/auth canaries.
  startup:
    path: /livez
    periodSeconds: 5
    failureThreshold: 60

# Example NetworkPolicy: ingress only from the ingress controller namespace to
# API/MCP, MCP -> API, and egress to DNS plus the CIDRs you list.
networkPolicy:
  enabled: false
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  # Egress allowances (PostgreSQL, Redis, OIDC, KMS, inference). Empty = allow all egress.
  egress: []
  #  - to:
  #      - ipBlock:
  #          cidr: 10.0.0.0/16
  #    ports:
  #      - port: 5432
  #        protocol: TCP

# ---------------------------------------------------------------------------
# Routing
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: memory.example.com
  # The MCP server serves at "/" internally; the proxy must strip /mcp.
  # ingress-nginx example (per-path rewrite requires a separate Ingress, which
  # the chart renders when mcp.enabled):
  mcpAnnotations: {}
  #  nginx.ingress.kubernetes.io/use-regex: "true"
  #  nginx.ingress.kubernetes.io/rewrite-target: /$2
  mcpPath: /mcp
  mcpPathType: Prefix
  tls: []
  #  - secretName: memory-example-com-tls
  #    hosts: [memory.example.com]

# Gateway API alternative (gateway.networking.k8s.io/v1 HTTPRoute).
httpRoute:
  enabled: false
  parentRefs: []
  #  - name: public-gateway
  #    namespace: gateway-system
  hostnames:
    - memory.example.com

# ---------------------------------------------------------------------------
# Bearer front door: API and MCP paths carry OAuth Bearer tokens straight to
# Fortemi (see docs/deployment/front-door.md).
# ---------------------------------------------------------------------------
frontDoor:
  # The bearer paths the Ingress/HTTPRoute above route straight to the API
  # and MCP Services. Never place these behind a cookie gate (for example an
  # oauth2-proxy auth-url/sign-in), and never convert cookies into
  # Authorization headers on them (SR-52). The chart's Ingress/HTTPRoute set
  # no authenticating annotations; keep it that way on these paths.
  bearerPaths:
    - /api/*
    - /mcp
    - /.well-known/oauth-protected-resource*
  # Strip the identity headers the edge must never trust on bearer paths
  # (SR-50). Fortemi itself only reads Authorization, but anything behind the
  # edge that honors proxy headers must not see client-supplied ones. For
  # ingress-nginx, merge a snippet like this into ingress.annotations and
  # ingress.mcpAnnotations (annotation strings cannot express the wildcard in
  # X-Auth-Request-*, so list the oauth2-proxy names explicitly):
  #   nginx.ingress.kubernetes.io/configuration-snippet: |
  #     proxy_set_header X-Forwarded-User "";
  #     proxy_set_header X-Forwarded-Email "";
  #     proxy_set_header X-Forwarded-Access-Token "";
  #     proxy_set_header X-Auth-Request-User "";
  #     proxy_set_header X-Auth-Request-Email "";
  #     proxy_set_header X-Auth-Request-Groups "";
  #     proxy_set_header X-Auth-Request-Preferred-Username "";
  #     proxy_set_header X-Auth-Request-Access-Token "";
  # FORTEMI_TRUSTED_PROXY_CIDRS must list only the ingress/gateway pod
  # addresses (SR-51): set it under env: with the pod CIDRs of your
  # cluster, for example from `kubectl -n ingress-nginx get pods -o wide`.
  # Never use node or pod-wide CIDRs.
  # Optional Istio defense in depth (SR-53). Fortemi validation remains
  # authoritative: RequestAuthentication alone admits requests that carry no
  # token, so it is always paired with the AuthorizationPolicy below.
  istio:
    enabled: false
    # External OIDC issuer, for example https://idp.example.com/realms/fortemi.
    issuer: ""
    # JWKS document of the issuer.
    jwksUri: ""
    # Accepted audiences, for example ["https://memory.example.com",
    # "https://memory.example.com/mcp"].
    audiences: []
