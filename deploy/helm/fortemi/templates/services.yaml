apiVersion: v1
kind: Service
metadata:
  name: {{ include "fortemi.fullname" . }}-api
  labels:
    {{- include "fortemi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "fortemi.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fortemi.fullname" . }}-mcp
  labels:
    {{- include "fortemi.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "fortemi.selectorLabels" (dict "ctx" . "component" "mcp") | nindent 4 }}
{{- end }}
