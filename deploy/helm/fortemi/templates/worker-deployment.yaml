{{- if .Values.worker.enabled }}
{{- $c := .Values.worker -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fortemi.fullname" . }}-worker
  labels:
    {{- include "fortemi.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fortemi.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fortemi.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "fortemi.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "fortemi.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # Probe-only listener; no Service selects worker pods.
            - name: http
              containerPort: {{ $c.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $c.port | quote }}
            - name: WORKER_ENABLED
              value: "true"
            {{- include "fortemi.serverEnv" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "fortemi.serverProbes" . | nindent 10 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "fortemi.serverVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "fortemi.serverVolumes" . | nindent 8 }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
