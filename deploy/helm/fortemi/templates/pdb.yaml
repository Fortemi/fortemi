{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fortemi.fullname" . }}-api
  labels:
    {{- include "fortemi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "fortemi.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
{{- end }}
{{- if and .Values.worker.enabled .Values.worker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fortemi.fullname" . }}-worker
  labels:
    {{- include "fortemi.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  maxUnavailable: {{ .Values.worker.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "fortemi.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
{{- end }}
{{- if and .Values.mcp.enabled .Values.mcp.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fortemi.fullname" . }}-mcp
  labels:
    {{- include "fortemi.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  minAvailable: {{ .Values.mcp.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "fortemi.selectorLabels" (dict "ctx" . "component" "mcp") | nindent 6 }}
{{- end }}
