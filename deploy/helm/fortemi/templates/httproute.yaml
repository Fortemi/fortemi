{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fortemi.fullname" . }}
  labels:
    {{- include "fortemi.labels" . | nindent 4 }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # RFC 9728 protected-resource metadata is served by the API. Match it
    # before the generic prefix rules so bearer clients always reach Fortemi
    # on this path (SR-52).
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
      backendRefs:
        - name: {{ include "fortemi.fullname" . }}-api
          port: {{ .Values.api.service.port }}
    {{- if .Values.mcp.enabled }}
    # MCP serves at "/" internally; strip the public /mcp prefix.
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.basePath }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "fortemi.fullname" . }}-mcp
          port: {{ .Values.mcp.service.port }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "fortemi.fullname" . }}-api
          port: {{ .Values.api.service.port }}
{{- end }}
