    "description": "Resolve hosted PAT ownership through a pinned SECURITY DEFINER HMAC lookup exposing only tenant id and active flag, revoke PUBLIC execute and grant only the verified runtime role at startup, then validate PAT/user data in that tenant transaction. Preserve HMAC/constant-time checks and indistinguishable invalid-token responses. Add production-router restricted-role tenant parity, live/replay isolation, invalid credential and function privilege tests; document the migration and permission contract."
