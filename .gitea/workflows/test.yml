          # on first boot, but these are a safety net for containers with pre-existing data volumes)
          docker exec ${DB_CONTAINER} psql -U "${DB_USER}" -d "${DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec ${DB_CONTAINER} psql -U "${DB_USER}" -d "${DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          FORTEMI_CI_DISPOSABLE_DATABASE=1 cargo run --locked -p matric-db \
            --features migrations --example ci_database_bootstrap

      - name: Run slow/ignored tests
        run: |
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          export INTEGRATION_TEST_DB=1
          export TEST_REDIS_URL="redis://localhost:${REDIS_PORT}"

          # Run tests marked with #[ignore] serially to avoid database state conflicts
          # (spatial search tests share the same tables and need isolation)
          # Use --tests to exclude doctests (doctests don't honor #[ignore])
          cargo test --workspace --tests -- --ignored --test-threads=1
        timeout-minutes: 60

      - name: Teardown PostgreSQL
        if: always()
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" ]]; then
            DB_CONTAINER="matric-slow-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
            REDIS_CONTAINER="matric-slow-redis-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -v ${REDIS_CONTAINER} || true
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -v ${DB_CONTAINER} || true
          else
            echo '::warning::Kept Docker resources: workflow-revision removal helper unavailable.'
          fi

      - name: Cleanup run-local build and Docker state
        if: always()
        run: |
          echo '::notice::Retained run directories for verified final quarantine reconciliation.'

  # Render-validate the Intel Arc / host-vLLM compose overlay (#1043).
  # Compose-render validation only — asserts the `!reset` tag clears the
  # NVIDIA device reservation and the split-provider env defaults render.
  # No Intel hardware or container startup involved.
  validate-intel-overlay:
    name: Validate Intel Compose Overlay
    runs-on: matric-builder
    needs: [admit-source, slow-tests]
    if: needs.admit-source.outputs.current == 'true' && (always() && needs.slow-tests.result != 'failure' && needs.slow-tests.result != 'cancelled')
    env:
      CI_WORKFLOW_SHA: ${{ gitea.sha }}
      CI_SAFETY_TOOLS: "${{ github.workspace }}/target/.ci-tools/${{ gitea.run_id }}-${{ gitea.run_attempt }}"
      CI_RUNS_ROOT: "${{ github.workspace }}/target/.ci-runs"
      CI_ACTIONS_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/docker-validate-intel-overlay"
    steps:
      - name: Checkout workflow-revision safety tooling
        run: |
          set -euo pipefail
          # Register a fresh checkout before Git writes; never follow an existing ancestor symlink.
          [[ "${CI_WORKFLOW_SHA:?CI_WORKFLOW_SHA is required}" =~ ^[0-9a-f]{40}$ ]]
          CI_SAFETY_TOOLS="$(python3 - <<'PYBOOT'
          import json, os, secrets, time
          owner, attempt = os.environ['CI_RESOURCE_SCOPE'], os.environ['CI_RESOURCE_ATTEMPT']
          assert all(v.isdecimal() and int(v) > 0 for v in (owner, attempt))
          base = os.path.dirname(os.environ['CI_SAFETY_TOOLS'])
          fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for part in os.path.abspath(base).split('/')[1:]:
                  try: os.mkdir(part, 0o700, dir_fd=fd)
                  except FileExistsError: pass
                  child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                  os.close(fd)
                  fd = child
              name = f'{owner}-{attempt}.{secrets.token_hex(12)}'
              os.mkdir(name, 0o700, dir_fd=fd)
              root = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  info = os.fstat(root)
                  marker = os.open('.owner.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root)
                  with os.fdopen(marker, 'w') as stream:
                      json.dump({'fortemi.ci.scope': owner, 'fortemi.ci.attempt': attempt,
                                 'created': time.time(), 'identity': [info.st_dev, info.st_ino]}, stream)
                      stream.flush()
                      os.fsync(stream.fileno())
              finally: os.close(root)
          finally: os.close(fd)
          print(os.path.join(base, name))
          PYBOOT
          )"
          export CI_SAFETY_TOOLS
          printf 'CI_SAFETY_TOOLS=%s\n' "$CI_SAFETY_TOOLS" >> "$GITHUB_ENV"
          git init -q "${CI_SAFETY_TOOLS}"
          git -C "${CI_SAFETY_TOOLS}" remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git -C "${CI_SAFETY_TOOLS}" sparse-checkout set scripts/ci
          git -C "${CI_SAFETY_TOOLS}" fetch --quiet --no-tags --depth=1 origin "${CI_WORKFLOW_SHA}"
          git -C "${CI_SAFETY_TOOLS}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${CI_SAFETY_TOOLS}" rev-parse HEAD)" = "${CI_WORKFLOW_SHA}"

      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${CHAIN_SOURCE_SHA:?CHAIN_SOURCE_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      # The fortemi-builder image ships the docker CLI but not the compose
      # plugin. Install it pinned by version + sha256 (supply-chain: no
      # floating tags, checksum verified against the official release).
      - name: Reconcile inactive runs and configure owned resources
        run: |
          python3 "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py"
          bash "${CI_SAFETY_TOOLS}/scripts/ci/setup-run-resources.sh"

      - name: Install docker compose plugin (pinned)
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "compose plugin already present: $(docker compose version --short)"
            exit 0
          fi
          COMPOSE_VERSION=v2.39.2
          COMPOSE_SHA256=a55a8cd4ef103aac282812554e531aac8df7e914a287ee81e14d695556a22902
          mkdir -p "${DOCKER_CONFIG}/cli-plugins"
          COMPOSE_DOWNLOAD=$(mktemp "${DOCKER_CONFIG}/compose.XXXXXX")
          trap 'rm -f "$COMPOSE_DOWNLOAD"' EXIT
          curl -fsSL -o "$COMPOSE_DOWNLOAD" \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  ${COMPOSE_DOWNLOAD}" | sha256sum -c -
          install -m 0755 "$COMPOSE_DOWNLOAD" "${DOCKER_CONFIG}/cli-plugins/docker-compose"
          docker compose version

      - name: Validate Intel overlay render
        run: ./scripts/validate-intel-overlay.sh

      - name: Cleanup run-local build and Docker state
        if: always()
        run: |
          echo '::notice::Retained run directories for verified final quarantine reconciliation.'

  # Test summary
  test-summary:
    name: Test Summary
    runs-on: matric-builder
    needs: [admit-source, fast-tests, integration-tests, coverage, slow-tests, validate-intel-overlay]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.admit-source.outputs.current }}" == false ]]; then
            echo '::notice::No current-source tests admitted; validation chain skipped.'
            exit 0
          fi
          echo "Test Summary:"
          echo "=============="
          echo "Fast tests: ${{ needs.fast-tests.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Intel overlay: ${{ needs.validate-intel-overlay.result }}"
          echo "Slow tests: ${{ needs.slow-tests.result || 'skipped' }}"

          if [ "${{ needs.fast-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ] || \
             { [ "${{ needs.slow-tests.result }}" != "success" ] && [ "${{ needs.slow-tests.result }}" != "skipped" ]; } || \
             [ "${{ needs.validate-intel-overlay.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          else
            echo "✅ Tests passed"
          fi

  handoff-sidecar:
    name: Dispatch Native Sidecar Builds
    runs-on: matric-builder
    needs: [test-summary]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && needs.test-summary.result == 'success'
    steps:
      - name: Checkout dispatch tooling
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${CHAIN_SOURCE_SHA:?CHAIN_SOURCE_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Fetch Gitea trigger token
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.gitea-release.spec

      - name: Dispatch sidecar builds at the tested ref
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "${GITHUB_REF:?GITHUB_REF is required}" \
            --arg source_sha "${CHAIN_SOURCE_SHA:?CHAIN_SOURCE_SHA is required}" \
            '{ref: $ref, inputs: {source_sha: $source_sha}}' > dispatch.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: token ${BUILD_REPO_TOKEN:?BUILD_REPO_TOKEN is required}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://git.integrolabs.net/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-sidecar.yml/dispatches" \
            --data-binary @dispatch.json

      - name: Cleanup trigger token
        if: always()
        run: ci/vault-fetch.sh --cleanup

  cleanup-run-images:
    name: Cleanup Run Resources
    runs-on: matric-builder
    needs: [runner-capacity, admit-source, build-testdb, fast-tests, integration-tests, coverage, slow-tests, validate-intel-overlay, test-summary, handoff-sidecar]
    if: always()
    env:
      CI_RUNS_ROOT: "${{ github.workspace }}/target/.ci-runs"
      CI_ACTIONS_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/docker-cleanup-run-images"
      CI_WORKFLOW_SHA: ${{ gitea.sha }}
      CI_SAFETY_TOOLS: "${{ github.workspace }}/target/.ci-tools/${{ gitea.run_id }}-${{ gitea.run_attempt }}"
    steps:
      - name: Checkout workflow-revision safety tooling
        run: |
          set -euo pipefail
          # Register a fresh checkout before Git writes; never follow an existing ancestor symlink.
          [[ "${CI_WORKFLOW_SHA:?CI_WORKFLOW_SHA is required}" =~ ^[0-9a-f]{40}$ ]]
          CI_SAFETY_TOOLS="$(python3 - <<'PYBOOT'
          import json, os, secrets, time
          owner, attempt = os.environ['CI_RESOURCE_SCOPE'], os.environ['CI_RESOURCE_ATTEMPT']
          assert all(v.isdecimal() and int(v) > 0 for v in (owner, attempt))
          base = os.path.dirname(os.environ['CI_SAFETY_TOOLS'])
          fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for part in os.path.abspath(base).split('/')[1:]:
                  try: os.mkdir(part, 0o700, dir_fd=fd)
                  except FileExistsError: pass
                  child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                  os.close(fd)
                  fd = child
              name = f'{owner}-{attempt}.{secrets.token_hex(12)}'
              os.mkdir(name, 0o700, dir_fd=fd)
              root = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  info = os.fstat(root)
                  marker = os.open('.owner.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root)
                  with os.fdopen(marker, 'w') as stream:
                      json.dump({'fortemi.ci.scope': owner, 'fortemi.ci.attempt': attempt,
                                 'created': time.time(), 'identity': [info.st_dev, info.st_ino]}, stream)
                      stream.flush()
                      os.fsync(stream.fileno())
              finally: os.close(root)
          finally: os.close(fd)
          print(os.path.join(base, name))
          PYBOOT
          )"
          export CI_SAFETY_TOOLS
          printf 'CI_SAFETY_TOOLS=%s\n' "$CI_SAFETY_TOOLS" >> "$GITHUB_ENV"
          git init -q "${CI_SAFETY_TOOLS}"
          git -C "${CI_SAFETY_TOOLS}" remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git -C "${CI_SAFETY_TOOLS}" sparse-checkout set scripts/ci
          git -C "${CI_SAFETY_TOOLS}" fetch --quiet --no-tags --depth=1 origin "${CI_WORKFLOW_SHA}"
          git -C "${CI_SAFETY_TOOLS}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${CI_SAFETY_TOOLS}" rev-parse HEAD)" = "${CI_WORKFLOW_SHA}"
      - name: Reconcile inactive runs
        if: always() && needs.admit-source.outputs.current == 'true'
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py" ]]; then
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py"
          else
            echo '::warning::Kept run resources: workflow-revision cleanup helper unavailable.'
          fi

      - name: Remove only this run's labelled resources
        if: always()
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py" ]]; then
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py" --current
          else
            echo '::warning::Kept run resources: workflow-revision cleanup helper unavailable.'
          fi

      - name: Cleanup safety tooling
        if: always()
        run: echo '::notice::Retained workflow tooling for verified final quarantine reconciliation.'
