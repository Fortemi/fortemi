# Enhanced Test Infrastructure with Coverage
#
# This workflow provides comprehensive testing with:
# - Test categorization (fast/integration/slow)
# - Code coverage reporting
# - PostgreSQL + pgvector + PostGIS test containers
# - Parallel unit tests; serial shared-database integration tests
# - Test fixtures and mock backends
#
# Usage:
#   - Runs on every push and PR
#   - Generates coverage reports
#   - Provides test categorization for selective runs

name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_category:
        description: 'Test category to run (fast/integration/slow/all)'
        required: false
        default: 'all'
      source_sha:
        description: 'Immutable source commit propagated by the validation workflow'
        required: false
        default: ''

concurrency:
  # PR pushes replace only the same workflow/branch. Tags retain the release
  # group; main pushes and exact-source main dispatches use unique groups.
  # The capacity-1 runner serialises jobs even when runs interleave. #1234
  group: ${{ gitea.event_name == 'pull_request' && format('{0}-pr-{1}', gitea.workflow, gitea.head_ref) || (startsWith(gitea.ref, 'refs/tags/') || (gitea.event_name == 'workflow_dispatch' && !(gitea.ref == 'refs/heads/main' && gitea.event.inputs.source_sha))) && 'fortemi-shared-runner' || format('{0}-run-{1}', gitea.workflow, gitea.run_id) }}
  cancel-in-progress: ${{ gitea.event_name == 'pull_request' }}

env:
  # Mutable daemon resources and compiler outputs belong to one run.
  CI_RESOURCE_SCOPE: "${{ gitea.run_id }}"
  CI_RESOURCE_ATTEMPT: "${{ gitea.run_attempt }}"
  TESTDB_IMAGE: "matric-testdb:ci-${{ gitea.run_id }}-${{ gitea.run_attempt }}"
  CARGO_TARGET_DIR: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/target"
  CARGO_INSTALL_ROOT: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/tools"
  CHAIN_SOURCE_SHA: ${{ github.event.inputs.source_sha || github.sha }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Cinstrument-coverage"
  LLVM_PROFILE_FILE: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/target/coverage/profile-%p-%m.profraw"
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}
  BUILD_REPO_TOKEN_VAULT_PATH: ${{ vars.BUILD_REPO_TOKEN_VAULT_PATH }}
  BUILD_REPO_TOKEN_VAULT_FIELD: ${{ vars.BUILD_REPO_TOKEN_VAULT_FIELD }}

jobs:
  runner-capacity:
    name: Runner Capacity Preflight
    runs-on: matric-builder
    steps:
      - name: Checkout capacity guard
        run: |
          set -euo pipefail
          [[ "${CHAIN_SOURCE_SHA:?CHAIN_SOURCE_SHA is required}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "CHAIN_SOURCE_SHA must be a lowercase 40-character commit SHA" >&2
            exit 1
          }
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${CHAIN_SOURCE_SHA}"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${CHAIN_SOURCE_SHA}"

      - name: Check free bytes and inodes
        env:
          RUNNER_MIN_FREE_KIB: ${{ vars.RUNNER_MIN_FREE_KIB }}
          RUNNER_MIN_FREE_INODES: ${{ vars.RUNNER_MIN_FREE_INODES }}
        run: bash scripts/ci/check-runner-capacity.sh

  # Build testdb image once for all jobs
  build-testdb:
    name: Build Test Database Image
    runs-on: matric-builder
    needs: [admit-source]
    if: needs.admit-source.outputs.current == 'true'
    env:
      CI_WORKFLOW_SHA: ${{ gitea.sha }}
      CI_SAFETY_TOOLS: "${{ github.workspace }}/target/.ci-tools/${{ gitea.run_id }}-${{ gitea.run_attempt }}"
      CI_RUNS_ROOT: "${{ github.workspace }}/target/.ci-runs"
      CI_ACTIONS_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/docker-build-testdb"
    steps:
      - name: Checkout workflow-revision safety tooling
        run: |
          set -euo pipefail
          # Register a fresh checkout before Git writes; never follow an existing ancestor symlink.
          [[ "${CI_WORKFLOW_SHA:?CI_WORKFLOW_SHA is required}" =~ ^[0-9a-f]{40}$ ]]
          CI_SAFETY_TOOLS="$(python3 - <<'PYBOOT'
          import json, os, secrets, time
          owner, attempt = os.environ['CI_RESOURCE_SCOPE'], os.environ['CI_RESOURCE_ATTEMPT']
          assert all(v.isdecimal() and int(v) > 0 for v in (owner, attempt))
          base = os.path.dirname(os.environ['CI_SAFETY_TOOLS'])
          fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for part in os.path.abspath(base).split('/')[1:]:
                  try: os.mkdir(part, 0o700, dir_fd=fd)
                  except FileExistsError: pass
                  child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                  os.close(fd)
                  fd = child
              name = f'{owner}-{attempt}.{secrets.token_hex(12)}'
              os.mkdir(name, 0o700, dir_fd=fd)
              root = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  info = os.fstat(root)
                  marker = os.open('.owner.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root)
                  with os.fdopen(marker, 'w') as stream:
                      json.dump({'fortemi.ci.scope': owner, 'fortemi.ci.attempt': attempt,
                                 'created': time.time(), 'identity': [info.st_dev, info.st_ino]}, stream)
                      stream.flush()
                      os.fsync(stream.fileno())
              finally: os.close(root)
          finally: os.close(fd)
          print(os.path.join(base, name))
          PYBOOT
          )"
          export CI_SAFETY_TOOLS
          printf 'CI_SAFETY_TOOLS=%s\n' "$CI_SAFETY_TOOLS" >> "$GITHUB_ENV"
          git init -q "${CI_SAFETY_TOOLS}"
          git -C "${CI_SAFETY_TOOLS}" remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git -C "${CI_SAFETY_TOOLS}" sparse-checkout set scripts/ci
          git -C "${CI_SAFETY_TOOLS}" fetch --quiet --no-tags --depth=1 origin "${CI_WORKFLOW_SHA}"
          git -C "${CI_SAFETY_TOOLS}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${CI_SAFETY_TOOLS}" rev-parse HEAD)" = "${CI_WORKFLOW_SHA}"

      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${CHAIN_SOURCE_SHA:?CHAIN_SOURCE_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Reconcile inactive runs and configure owned resources
        run: |
          python3 "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py"
          bash "${CI_SAFETY_TOOLS}/scripts/ci/setup-run-resources.sh"

      - name: Build testdb image
        run: |
          docker build -f build/Dockerfile.testdb -t "${TESTDB_IMAGE}" .
          echo "Built testdb image for testing"

      - name: Cleanup run-local build and Docker state
        if: always()
        run: |
          echo '::notice::Retained run directories for verified final quarantine reconciliation.'

  admit-source:
    name: Admit current main source
    runs-on: matric-builder
    needs: [runner-capacity]
    outputs:
      current: ${{ steps.freshness.outputs.current }}
    env:
      CI_WORKFLOW_SHA: ${{ gitea.sha }}
      CI_SAFETY_TOOLS: "${{ github.workspace }}/target/.ci-tools/${{ gitea.run_id }}-${{ gitea.run_attempt }}"
    steps:
      - name: Checkout workflow-revision safety tooling
        run: |
          set -euo pipefail
          # Register a fresh checkout before Git writes; never follow an existing ancestor symlink.
          [[ "${CI_WORKFLOW_SHA:?CI_WORKFLOW_SHA is required}" =~ ^[0-9a-f]{40}$ ]]
          CI_SAFETY_TOOLS="$(python3 - <<'PYBOOT'
          import json, os, secrets, time
          owner, attempt = os.environ['CI_RESOURCE_SCOPE'], os.environ['CI_RESOURCE_ATTEMPT']
          assert all(v.isdecimal() and int(v) > 0 for v in (owner, attempt))
          base = os.path.dirname(os.environ['CI_SAFETY_TOOLS'])
          fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for part in os.path.abspath(base).split('/')[1:]:
                  try: os.mkdir(part, 0o700, dir_fd=fd)
                  except FileExistsError: pass
                  child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                  os.close(fd)
                  fd = child
              name = f'{owner}-{attempt}.{secrets.token_hex(12)}'
              os.mkdir(name, 0o700, dir_fd=fd)
              root = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  info = os.fstat(root)
                  marker = os.open('.owner.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root)
                  with os.fdopen(marker, 'w') as stream:
                      json.dump({'fortemi.ci.scope': owner, 'fortemi.ci.attempt': attempt,
                                 'created': time.time(), 'identity': [info.st_dev, info.st_ino]}, stream)
                      stream.flush()
                      os.fsync(stream.fileno())
              finally: os.close(root)
          finally: os.close(fd)
          print(os.path.join(base, name))
          PYBOOT
          )"
          export CI_SAFETY_TOOLS
          printf 'CI_SAFETY_TOOLS=%s\n' "$CI_SAFETY_TOOLS" >> "$GITHUB_ENV"
          git init -q "${CI_SAFETY_TOOLS}"
          git -C "${CI_SAFETY_TOOLS}" remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git -C "${CI_SAFETY_TOOLS}" sparse-checkout set scripts/ci
          git -C "${CI_SAFETY_TOOLS}" fetch --quiet --no-tags --depth=1 origin "${CI_WORKFLOW_SHA}"
          git -C "${CI_SAFETY_TOOLS}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${CI_SAFETY_TOOLS}" rev-parse HEAD)" = "${CI_WORKFLOW_SHA}"
      - name: Check main tip before heavy work
        id: freshness
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${GITHUB_REF}" == refs/heads/main ]]; then
            cd "${CI_SAFETY_TOOLS}"
            result=0
            bash scripts/ci/main-tip-guard.sh || result=$?
            if [[ "$result" == 10 ]]; then
              echo 'current=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$result" == 0 ]] || exit "$result"
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Cleanup admission tooling
        if: always()
        run: echo '::notice::Retained workflow tooling for verified final quarantine reconciliation.'

  # Fast unit tests (with database - lib tests include DB integration tests)
  fast-tests:
    name: Fast Unit Tests
    runs-on: matric-builder
    needs: [admit-source, build-testdb]
    if: needs.admit-source.outputs.current == 'true'
    env:
      CI_WORKFLOW_SHA: ${{ gitea.sha }}
      CI_SAFETY_TOOLS: "${{ github.workspace }}/target/.ci-tools/${{ gitea.run_id }}-${{ gitea.run_attempt }}"
      CI_RUNS_ROOT: "${{ github.workspace }}/target/.ci-runs"
      CI_ACTIONS_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/docker-fast-tests"
    steps:
      - name: Checkout workflow-revision safety tooling
        run: |
          set -euo pipefail
          # Register a fresh checkout before Git writes; never follow an existing ancestor symlink.
          [[ "${CI_WORKFLOW_SHA:?CI_WORKFLOW_SHA is required}" =~ ^[0-9a-f]{40}$ ]]
          CI_SAFETY_TOOLS="$(python3 - <<'PYBOOT'
          import json, os, secrets, time
          owner, attempt = os.environ['CI_RESOURCE_SCOPE'], os.environ['CI_RESOURCE_ATTEMPT']
          assert all(v.isdecimal() and int(v) > 0 for v in (owner, attempt))
          base = os.path.dirname(os.environ['CI_SAFETY_TOOLS'])
          fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for part in os.path.abspath(base).split('/')[1:]:
                  try: os.mkdir(part, 0o700, dir_fd=fd)
                  except FileExistsError: pass
                  child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                  os.close(fd)
                  fd = child
              name = f'{owner}-{attempt}.{secrets.token_hex(12)}'
              os.mkdir(name, 0o700, dir_fd=fd)
              root = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  info = os.fstat(root)
                  marker = os.open('.owner.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root)
                  with os.fdopen(marker, 'w') as stream:
                      json.dump({'fortemi.ci.scope': owner, 'fortemi.ci.attempt': attempt,
                                 'created': time.time(), 'identity': [info.st_dev, info.st_ino]}, stream)
                      stream.flush()
                      os.fsync(stream.fileno())
              finally: os.close(root)
          finally: os.close(fd)
          print(os.path.join(base, name))
          PYBOOT
          )"
          export CI_SAFETY_TOOLS
          printf 'CI_SAFETY_TOOLS=%s\n' "$CI_SAFETY_TOOLS" >> "$GITHUB_ENV"
          git init -q "${CI_SAFETY_TOOLS}"
          git -C "${CI_SAFETY_TOOLS}" remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git -C "${CI_SAFETY_TOOLS}" sparse-checkout set scripts/ci
          git -C "${CI_SAFETY_TOOLS}" fetch --quiet --no-tags --depth=1 origin "${CI_WORKFLOW_SHA}"
          git -C "${CI_SAFETY_TOOLS}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${CI_SAFETY_TOOLS}" rev-parse HEAD)" = "${CI_WORKFLOW_SHA}"

      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${CHAIN_SOURCE_SHA:?CHAIN_SOURCE_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Reconcile inactive runs and configure owned resources
        run: |
          python3 "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py"
          bash "${CI_SAFETY_TOOLS}/scripts/ci/setup-run-resources.sh"

      - name: Build testdb image
        run: |
          docker build -f build/Dockerfile.testdb -t "${TESTDB_IMAGE}" .

      # Compiler outputs are isolated by run; registry caches stay shared.

      - name: Setup PostgreSQL
        run: |
          set -e
          DB_CONTAINER="matric-fast-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          DB_USER="matric"
          DB_PASSWORD="fortemi-ci-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          DB_NAME="matric_test"
          echo "DB_CONTAINER=${DB_CONTAINER}" >> $GITHUB_ENV
          echo "DB_USER=${DB_USER}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${DB_PASSWORD}" >> $GITHUB_ENV
          echo "DB_NAME=${DB_NAME}" >> $GITHUB_ENV

          python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -v ${DB_CONTAINER} || true

          docker run -d --label "fortemi.ci.scope=${CI_RESOURCE_SCOPE}" --name ${DB_CONTAINER} \
            -p 127.0.0.1::5432 \
            -e POSTGRES_USER="${DB_USER}" \
            -e POSTGRES_PASSWORD="${DB_PASSWORD}" \
            -e POSTGRES_DB="${DB_NAME}" \
            "${TESTDB_IMAGE}"
          DB_PORT=$(docker port "${DB_CONTAINER}" 5432/tcp | head -1 | sed 's/.*://')
          echo "DB_PORT=${DB_PORT}" >> "$GITHUB_ENV"

          for i in {1..30}; do
            if docker exec ${DB_CONTAINER} pg_isready -U "${DB_USER}" 2>/dev/null; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Setup Redis for SSE token tests
        run: bash scripts/ci/test-redis.sh start "matric-fast-redis-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"

      - name: Run migrations
        run: |
          set -euo pipefail
          DB_CONTAINER="matric-fast-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          # Ensure extensions exist (matric is superuser in testdb image; init-extensions.sh handles this
          # on first boot, but these are a safety net for containers with pre-existing data volumes)
          docker exec ${DB_CONTAINER} psql -U "${DB_USER}" -d "${DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec ${DB_CONTAINER} psql -U "${DB_USER}" -d "${DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          FORTEMI_CI_DISPOSABLE_DATABASE=1 cargo run --locked -p matric-db \
            --features migrations --example ci_database_bootstrap

      - name: Install locked MCP test dependencies
        working-directory: mcp-server
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Run fast tests
        run: |
          set -euo pipefail
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          export INTEGRATION_TEST_DB=1
          # Library tests include database-backed cases sharing this fixture.
          # Serialize test cases as in the integration and builder workflows.
          cargo test --lib --workspace -- --test-threads=1
          cargo test --locked -p matric-crypto --features kms-vault --lib
          cargo test --locked -p matric-api --features hosted-auth,kms-vault --bin matric-api kms::tests
          cargo test --locked -p matric-api --features hosted-auth,kms-vault --bin matric-api verified_tenant_policy_context
          cargo test --locked -p matric-api --features hosted-auth,kms-vault --bin matric-api hosted_sse_filters
          cargo test --locked -p matric-api --features hosted-auth,kms-vault --bin matric-api sse_tests -- --test-threads=1
          # Hosted route qualification evidence (docs/deployment/hosted-route-qualification.md).
          cargo test --locked -p matric-api --features hosted-auth,kms-vault --bin matric-api scoped_search_tests -- --test-threads=1
          cargo test --locked -p matric-api --features hosted-auth,kms-vault --bin matric-api handlers::inference_complete::tests::hosted_model_policy
          cargo test --locked -p matric-api --features hosted-auth,kms-vault --bin matric-api handlers::token_info::tests::hosted_contexts
          FORTEMI_HOSTED_CREATE_TEST_ADMIN_URL="$DATABASE_URL" cargo test --locked -p matric-api --features hosted-auth,kms-vault --bin matric-api hosted_create_note_tests -- --test-threads=1
          FORTEMI_HOSTED_BOOTSTRAP_TEST_ADMIN_URL="$DATABASE_URL" cargo test --locked -p matric-api --features hosted-auth,kms-vault --test hosted_bootstrap_test -- --test-threads=1
          cargo test --locked -p matric-core --features otel --lib telemetry
          cargo test --locked -p matric-api --features otel --bin matric-api otel::
          cargo test --doc --workspace

      - name: OTLP collector integration
        run: |
          # Disposable DB + digest-pinned collector (ci/digests.txt) (#1156).
          TESTDB_IMAGE="${TESTDB_IMAGE}" scripts/test-otel-collector.sh

      - name: MCP external OIDC issuer end-to-end
        run: |
          # Disposable DB + digest-pinned Redis (ci/digests.txt) + TLS fixture issuer,
          # hosted API and MCP over HTTP; ephemeral keys only (#1151).
          TESTDB_IMAGE="${TESTDB_IMAGE}" scripts/test-mcp-external-issuer.sh

      - name: Keycloak reference realm end-to-end
        # About 50 s with a warm build and a cached image; the margin covers a
        # cold Keycloak pull and an incremental matric-api build on a busy runner.
        timeout-minutes: 15
        run: |
          # Real digest-pinned Keycloak, shipped realm/claim policy and tree-built API.
          TESTDB_IMAGE="${TESTDB_IMAGE}" scripts/test-keycloak-reference-realm.sh

      - name: Teardown PostgreSQL
        if: always()
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" ]]; then
            DB_CONTAINER="matric-fast-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -v ${DB_CONTAINER} || true
          else
            echo '::warning::Kept Docker resources: workflow-revision removal helper unavailable.'
          fi

      - name: Teardown Redis
        if: always()
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" ]]; then
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -fv "matric-fast-redis-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          else
            echo '::warning::Kept Docker resources: workflow-revision removal helper unavailable.'
          fi

      - name: Cleanup run-local build and Docker state
        if: always()
        run: |
          echo '::notice::Retained run directories for verified final quarantine reconciliation.'

  # Integration tests (with database)
  integration-tests:
    name: Integration Tests
    runs-on: matric-builder
    needs: [admit-source, fast-tests, build-testdb]
    if: needs.admit-source.outputs.current == 'true'
    env:
      CI_WORKFLOW_SHA: ${{ gitea.sha }}
      CI_SAFETY_TOOLS: "${{ github.workspace }}/target/.ci-tools/${{ gitea.run_id }}-${{ gitea.run_attempt }}"
      CI_RUNS_ROOT: "${{ github.workspace }}/target/.ci-runs"
      CI_ACTIONS_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/docker-integration-tests"
    steps:
      - name: Checkout workflow-revision safety tooling
        run: |
          set -euo pipefail
          # Register a fresh checkout before Git writes; never follow an existing ancestor symlink.
          [[ "${CI_WORKFLOW_SHA:?CI_WORKFLOW_SHA is required}" =~ ^[0-9a-f]{40}$ ]]
          CI_SAFETY_TOOLS="$(python3 - <<'PYBOOT'
          import json, os, secrets, time
          owner, attempt = os.environ['CI_RESOURCE_SCOPE'], os.environ['CI_RESOURCE_ATTEMPT']
          assert all(v.isdecimal() and int(v) > 0 for v in (owner, attempt))
          base = os.path.dirname(os.environ['CI_SAFETY_TOOLS'])
          fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for part in os.path.abspath(base).split('/')[1:]:
                  try: os.mkdir(part, 0o700, dir_fd=fd)
                  except FileExistsError: pass
                  child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                  os.close(fd)
                  fd = child
              name = f'{owner}-{attempt}.{secrets.token_hex(12)}'
              os.mkdir(name, 0o700, dir_fd=fd)
              root = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  info = os.fstat(root)
                  marker = os.open('.owner.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root)
                  with os.fdopen(marker, 'w') as stream:
                      json.dump({'fortemi.ci.scope': owner, 'fortemi.ci.attempt': attempt,
                                 'created': time.time(), 'identity': [info.st_dev, info.st_ino]}, stream)
                      stream.flush()
                      os.fsync(stream.fileno())
              finally: os.close(root)
          finally: os.close(fd)
          print(os.path.join(base, name))
          PYBOOT
          )"
          export CI_SAFETY_TOOLS
          printf 'CI_SAFETY_TOOLS=%s\n' "$CI_SAFETY_TOOLS" >> "$GITHUB_ENV"
          git init -q "${CI_SAFETY_TOOLS}"
          git -C "${CI_SAFETY_TOOLS}" remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git -C "${CI_SAFETY_TOOLS}" sparse-checkout set scripts/ci
          git -C "${CI_SAFETY_TOOLS}" fetch --quiet --no-tags --depth=1 origin "${CI_WORKFLOW_SHA}"
          git -C "${CI_SAFETY_TOOLS}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${CI_SAFETY_TOOLS}" rev-parse HEAD)" = "${CI_WORKFLOW_SHA}"

      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${CHAIN_SOURCE_SHA:?CHAIN_SOURCE_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Reconcile inactive runs and configure owned resources
        run: |
          python3 "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py"
          bash "${CI_SAFETY_TOOLS}/scripts/ci/setup-run-resources.sh"

      - name: Build testdb image
        run: |
          docker build -f build/Dockerfile.testdb -t "${TESTDB_IMAGE}" .

      # Compiler outputs are isolated by run; registry caches stay shared.

      - name: Setup PostgreSQL
        run: |
          set -e
          DB_CONTAINER="matric-test-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          DB_USER="matric"
          DB_PASSWORD="fortemi-ci-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          DB_NAME="matric_test"
          echo "DB_CONTAINER=${DB_CONTAINER}" >> $GITHUB_ENV
          echo "DB_USER=${DB_USER}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${DB_PASSWORD}" >> $GITHUB_ENV
          echo "DB_NAME=${DB_NAME}" >> $GITHUB_ENV

          python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -v ${DB_CONTAINER} || true

          # Start PostgreSQL with pgvector
          docker run -d --label "fortemi.ci.scope=${CI_RESOURCE_SCOPE}" --name ${DB_CONTAINER} \
            -p 127.0.0.1::5432 \
            -e POSTGRES_USER="${DB_USER}" \
            -e POSTGRES_PASSWORD="${DB_PASSWORD}" \
            -e POSTGRES_DB="${DB_NAME}" \
            "${TESTDB_IMAGE}"
          DB_PORT=$(docker port "${DB_CONTAINER}" 5432/tcp | head -1 | sed 's/.*://')
          echo "DB_PORT=${DB_PORT}" >> "$GITHUB_ENV"

          # Wait for PostgreSQL
          for i in {1..30}; do
            if docker exec ${DB_CONTAINER} pg_isready -U "${DB_USER}" 2>/dev/null; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Setup Redis for SSE token tests
        run: bash scripts/ci/test-redis.sh start "matric-test-redis-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"

      - name: Run migrations
        run: |
          set -euo pipefail
          DB_CONTAINER="matric-test-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          # Ensure extensions exist (matric is superuser in testdb image; init-extensions.sh handles this
          # on first boot, but these are a safety net for containers with pre-existing data volumes)
          docker exec ${DB_CONTAINER} psql -U "${DB_USER}" -d "${DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec ${DB_CONTAINER} psql -U "${DB_USER}" -d "${DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          FORTEMI_CI_DISPOSABLE_DATABASE=1 cargo run --locked -p matric-db \
            --features migrations --example ci_database_bootstrap

      - name: Run worker integration tests (serial, first)
        run: |
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"

          # Worker tests require serial execution due to shared database state
          # (tests share job queue, workers can claim jobs from other tests)
          # Run these FIRST on a clean database before other tests create data
          cargo test --package matric-jobs --test worker_integration_test --test archive_input_isolation_test -- --test-threads=1
        timeout-minutes: 10

      - name: Run ADR-090 tenant isolation and role catalog gate
        run: |
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          export FORTEMI_REQUIRE_LIVE_POSTGRES_TESTS=1
          cargo test --package matric-db --features migrations --test tenant_isolation_matrix_test -- --test-threads=1 --nocapture
        timeout-minutes: 15

      - name: Run point-in-time memory export contract (#1157)
        run: |
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          cargo test --locked --package matric-db --features migrations --test memory_export_contract_test -- --test-threads=1
        timeout-minutes: 15

      - name: Run other integration tests
        run: |
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          export INTEGRATION_TEST_DB=1

          # Catalog assertions inspect every archive, and fixture DDL/child
          # processes do not share a Rust mutex (#1142). Serialize test cases
          # sharing this database, as in ci-builder.yaml. Tests that create
          # concurrent requests internally retain that concurrency.
          # matric-jobs tests already ran above.
          cargo test --workspace --tests --exclude matric-jobs -- --test-threads=1
        timeout-minutes: 30

      - name: Teardown PostgreSQL
        if: always()
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" ]]; then
            DB_CONTAINER="matric-test-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -v ${DB_CONTAINER} || true
          else
            echo '::warning::Kept Docker resources: workflow-revision removal helper unavailable.'
          fi

      - name: Teardown Redis
        if: always()
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" ]]; then
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -fv "matric-test-redis-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          else
            echo '::warning::Kept Docker resources: workflow-revision removal helper unavailable.'
          fi

      - name: Cleanup run-local build and Docker state
        if: always()
        run: |
          echo '::notice::Retained run directories for verified final quarantine reconciliation.'

  # Coverage generation
  coverage:
    name: Code Coverage
    runs-on: matric-builder
    needs: [admit-source, fast-tests, integration-tests, build-testdb]
    if: needs.admit-source.outputs.current == 'true'
    env:
      CI_WORKFLOW_SHA: ${{ gitea.sha }}
      CI_SAFETY_TOOLS: "${{ github.workspace }}/target/.ci-tools/${{ gitea.run_id }}-${{ gitea.run_attempt }}"
      CI_RUNS_ROOT: "${{ github.workspace }}/target/.ci-runs"
      CI_ACTIONS_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: "${{ github.workspace }}/target/.ci-runs/${{ gitea.run_id }}-${{ gitea.run_attempt }}/docker-coverage"
    steps:
      - name: Checkout workflow-revision safety tooling
        run: |
          set -euo pipefail
          # Register a fresh checkout before Git writes; never follow an existing ancestor symlink.
          [[ "${CI_WORKFLOW_SHA:?CI_WORKFLOW_SHA is required}" =~ ^[0-9a-f]{40}$ ]]
          CI_SAFETY_TOOLS="$(python3 - <<'PYBOOT'
          import json, os, secrets, time
          owner, attempt = os.environ['CI_RESOURCE_SCOPE'], os.environ['CI_RESOURCE_ATTEMPT']
          assert all(v.isdecimal() and int(v) > 0 for v in (owner, attempt))
          base = os.path.dirname(os.environ['CI_SAFETY_TOOLS'])
          fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for part in os.path.abspath(base).split('/')[1:]:
                  try: os.mkdir(part, 0o700, dir_fd=fd)
                  except FileExistsError: pass
                  child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                  os.close(fd)
                  fd = child
              name = f'{owner}-{attempt}.{secrets.token_hex(12)}'
              os.mkdir(name, 0o700, dir_fd=fd)
              root = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  info = os.fstat(root)
                  marker = os.open('.owner.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root)
                  with os.fdopen(marker, 'w') as stream:
                      json.dump({'fortemi.ci.scope': owner, 'fortemi.ci.attempt': attempt,
                                 'created': time.time(), 'identity': [info.st_dev, info.st_ino]}, stream)
                      stream.flush()
                      os.fsync(stream.fileno())
              finally: os.close(root)
          finally: os.close(fd)
          print(os.path.join(base, name))
          PYBOOT
          )"
          export CI_SAFETY_TOOLS
          printf 'CI_SAFETY_TOOLS=%s\n' "$CI_SAFETY_TOOLS" >> "$GITHUB_ENV"
          git init -q "${CI_SAFETY_TOOLS}"
          git -C "${CI_SAFETY_TOOLS}" remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git -C "${CI_SAFETY_TOOLS}" sparse-checkout set scripts/ci
          git -C "${CI_SAFETY_TOOLS}" fetch --quiet --no-tags --depth=1 origin "${CI_WORKFLOW_SHA}"
          git -C "${CI_SAFETY_TOOLS}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${CI_SAFETY_TOOLS}" rev-parse HEAD)" = "${CI_WORKFLOW_SHA}"

      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${CHAIN_SOURCE_SHA:?CHAIN_SOURCE_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Reconcile inactive runs and configure owned resources
        run: |
          python3 "${CI_SAFETY_TOOLS}/scripts/ci/reconcile-run-resources.py"
          bash "${CI_SAFETY_TOOLS}/scripts/ci/setup-run-resources.sh"

      - name: Build testdb image
        run: |
          docker build -f build/Dockerfile.testdb -t "${TESTDB_IMAGE}" .

      - name: Setup PostgreSQL for coverage
        run: |
          set -e
          DB_CONTAINER="matric-coverage-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          DB_USER="matric"
          DB_PASSWORD="fortemi-ci-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          DB_NAME="matric_test"
          echo "DB_CONTAINER=${DB_CONTAINER}" >> $GITHUB_ENV
          echo "DB_USER=${DB_USER}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${DB_PASSWORD}" >> $GITHUB_ENV
          echo "DB_NAME=${DB_NAME}" >> $GITHUB_ENV

          python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -v ${DB_CONTAINER} || true

          docker run -d --label "fortemi.ci.scope=${CI_RESOURCE_SCOPE}" --name ${DB_CONTAINER} \
            -p 127.0.0.1::5432 \
            -e POSTGRES_USER="${DB_USER}" \
            -e POSTGRES_PASSWORD="${DB_PASSWORD}" \
            -e POSTGRES_DB="${DB_NAME}" \
            "${TESTDB_IMAGE}"
          DB_PORT=$(docker port "${DB_CONTAINER}" 5432/tcp | head -1 | sed 's/.*://')
          echo "DB_PORT=${DB_PORT}" >> "$GITHUB_ENV"

          for i in {1..30}; do
            if docker exec ${DB_CONTAINER} pg_isready -U "${DB_USER}" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          # Ensure extensions exist (matric is superuser in testdb image)
          docker exec ${DB_CONTAINER} psql -U "${DB_USER}" -d "${DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec ${DB_CONTAINER} psql -U "${DB_USER}" -d "${DB_NAME}" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          FORTEMI_CI_DISPOSABLE_DATABASE=1 cargo run --locked -p matric-db \
            --features migrations --example ci_database_bootstrap

      - name: Setup Redis for SSE token tests
        run: bash scripts/ci/test-redis.sh start "matric-coverage-redis-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"

      # --all-features compiles the hosted MCP regression tests, which need
      # the locked mcp-server dependencies.
      - name: Install locked MCP test dependencies
        working-directory: mcp-server
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Install llvm-cov
        run: |
          export PATH="${CARGO_INSTALL_ROOT}/bin:${PATH}"
          echo "${CARGO_INSTALL_ROOT}/bin" >> "$GITHUB_PATH"
          cargo install cargo-llvm-cov || true

      - name: Generate coverage (worker tests serial)
        run: |
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"

          mkdir -p "${CARGO_TARGET_DIR}/coverage"

          # Run worker tests first with serial execution (they share job queue state)
          cargo llvm-cov --all-features --package matric-jobs --test worker_integration_test --test archive_input_isolation_test -- --test-threads=1
        timeout-minutes: 15

      - name: Generate coverage (matric-jobs lib tests)
        run: |
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"

          # Run matric-jobs lib tests (adapter unit tests, extraction registry, extraction handler)
          # These are independent of worker integration tests and safe to run in parallel
          cargo llvm-cov --all-features --package matric-jobs --lib --no-clean
        timeout-minutes: 5

      - name: Generate coverage (other tests)
        run: |
          export DATABASE_URL="$(printf '%s%s:%s@localhost:%s/%s' 'postgres://' "${DB_USER}" "${DB_PASSWORD}" "${DB_PORT}" "${DB_NAME}")"
          export INTEGRATION_TEST_DB=1

          # Run all other tests with coverage (accumulate with --no-clean)
          # Exclude matric-inference: its integration tests (behind --all-features)
          # require a live Ollama server and are already covered by the GPU
          # integration test job in ci-builder.yaml.
          # Match the integration lane's shared-catalog isolation (#1142).
          cargo llvm-cov --all-features --workspace --exclude matric-jobs --exclude matric-inference --no-clean -- --test-threads=1

          # Run matric-inference without the integration feature to get coverage
          # of its unit tests without triggering Ollama-dependent tests.
          cargo llvm-cov --package matric-inference --no-clean --lcov --output-path "${CARGO_TARGET_DIR}/coverage/lcov.info"
        timeout-minutes: 45

      - name: Generate coverage report
        run: |
          # Generate human-readable summary
          cargo llvm-cov report --summary-only > "${CARGO_TARGET_DIR}/coverage/summary.txt" || true
          cat "${CARGO_TARGET_DIR}/coverage/summary.txt" || echo "Coverage summary not available"

      - name: Coverage summary in PR comment
        if: github.event_name == 'pull_request'
        run: |
          if [ -f "${CARGO_TARGET_DIR}/coverage/summary.txt" ]; then
            echo "### Coverage Report" > coverage_comment.md
            echo '```' >> coverage_comment.md
            cat "${CARGO_TARGET_DIR}/coverage/summary.txt" >> coverage_comment.md
            echo '```' >> coverage_comment.md

            # Post comment via API (requires token with repo write access)
            # This is optional - remove if not configured
            # curl -X POST \
            #   -H "Authorization: token ${{ github.token }}" \
            #   -H "Content-Type: application/json" \
            #   "https://git.integrolabs.net/api/v1/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/reviews" \
            #   -d "{\"body\": $(cat coverage_comment.md | jq -Rs .), \"event\": \"COMMENT\"}" || true
          fi

      - name: Teardown PostgreSQL
        if: always()
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" ]]; then
            DB_CONTAINER="matric-coverage-db-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -v ${DB_CONTAINER} || true
          else
            echo '::warning::Kept Docker resources: workflow-revision removal helper unavailable.'
          fi

      - name: Teardown Redis
        if: always()
        run: |
          if [[ -f "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" ]]; then
            python3 "${CI_SAFETY_TOOLS}/scripts/ci/owned-docker.py" rm -fv "matric-coverage-redis-${CI_RESOURCE_SCOPE}-${CI_RESOURCE_ATTEMPT}"
          else
            echo '::warning::Kept Docker resources: workflow-revision removal helper unavailable.'
          fi

      - name: Cleanup run-local build and Docker state
        if: always()
        run: |
          echo '::notice::Retained run directories for verified final quarantine reconciliation.'

