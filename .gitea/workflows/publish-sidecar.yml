# Publish matric-api Sidecar Binaries (ci)
#
# Builds native matric-api binaries for Desktop sidecar use
# and publishes them as Gitea release assets.
#
# Targets:
#   - matric-api-x86_64-unknown-linux-gnu  (built on matric-builder)
#   - matric-api-aarch64-unknown-linux-gnu (built in native ARM64 Linux on mutsu)
#   - matric-api-aarch64-apple-darwin      (built on mutsu via SSH)
#   - matric-api-x86_64-apple-darwin       (cross-compiled on mutsu via SSH)
#                                            consumed by BT6-ARSENAL universal
#                                            DMG build (lipo'd with aarch64).
#
# Release strategy:
#   - Push to main: publishes an immutable `sidecar-<12-char-commit>` release,
#     then updates rolling `sidecar-latest` as a discovery pointer
#   - Tag push (v*): attaches binaries to the versioned release
#
# Download URLs:
#   https://git.integrolabs.net/Fortemi/fortemi/releases/download/sidecar-latest/matric-api-x86_64-unknown-linux-gnu
#   https://git.integrolabs.net/Fortemi/fortemi/releases/download/sidecar-latest/matric-api-aarch64-unknown-linux-gnu
#   https://git.integrolabs.net/Fortemi/fortemi/releases/download/sidecar-latest/matric-api-aarch64-apple-darwin
#   https://git.integrolabs.net/Fortemi/fortemi/releases/download/sidecar-latest/matric-api-x86_64-apple-darwin
#
# Auth: uses github.token (no extra secrets needed — internal Gitea)
#
# Runners:
#   matric-builder  - Linux x86_64 builds
#   mutsu           - macOS aarch64 builds (M4 Mac mini)

name: Publish Sidecar Binaries

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'migrations/**'
      - '.gitea/workflows/publish-sidecar.yml'
      - 'scripts/ci/publish-sidecar-release.sh'
      - 'scripts/ci/verify-sidecar-publication.py'
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITEA_API: https://git.integrolabs.net/api/v1
  REPO: Fortemi/fortemi
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}
  MUTSU_SSH_KEY_VAULT_PATH: ${{ vars.MUTSU_SSH_KEY_VAULT_PATH }}
  MUTSU_SSH_KEY_VAULT_FIELD: ${{ vars.MUTSU_SSH_KEY_VAULT_FIELD }}

jobs:
  runner-capacity:
    name: Runner Capacity Preflight
    runs-on: matric-builder
    steps:
      - name: Checkout capacity guard
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA:?GITHUB_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Check free bytes and inodes
        env:
          RUNNER_MIN_FREE_KIB: ${{ vars.RUNNER_MIN_FREE_KIB }}
          RUNNER_MIN_FREE_INODES: ${{ vars.RUNNER_MIN_FREE_INODES }}
        run: bash scripts/ci/check-runner-capacity.sh

  # ─── Linux x86_64 ──────────────────────────────────────────────────────
  build-linux:
    name: Build Linux x86_64
    runs-on: matric-builder
    needs: [runner-capacity]
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA:?GITHUB_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Build release binary
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          MATRIC_VERSION="${GITHUB_REF_NAME}" \
          MATRIC_GIT_SHA="${GITHUB_SHA}" \
          MATRIC_BUILD_DATE="${BUILD_DATE}" \
          cargo build --release --package matric-api

          cp target/release/matric-api matric-api-x86_64-unknown-linux-gnu
          chmod +x matric-api-x86_64-unknown-linux-gnu

          # Verify the binary runs
          ./matric-api-x86_64-unknown-linux-gnu --version || echo "No --version flag, binary exists"
          file matric-api-x86_64-unknown-linux-gnu
          ls -lh matric-api-x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5  # v3
        with:
          name: matric-api-x86_64-unknown-linux-gnu
          path: matric-api-x86_64-unknown-linux-gnu

  # ─── Linux aarch64 (native Colima VM on mutsu) ─────────────────────────
  build-linux-arm64:
    name: Build Linux aarch64 on mutsu
    runs-on: titan
    timeout-minutes: 180
    steps:
      - name: Checkout coordinator tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Fetch mutsu SSH key from vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.mutsu.spec

      - name: Configure pinned mutsu host identity
        shell: bash
        run: |
          set -euo pipefail
          test -s "${MUTSU_SSH_KEY_FILE:?MUTSU_SSH_KEY_FILE is required}"
          ssh_dir="${RUNNER_TEMP:?}/fortemi-mutsu-${GITHUB_RUN_ID}-linux-arm64"
          install -d -m 700 "$ssh_dir"
          tr -d '\r' <"$MUTSU_SSH_KEY_FILE" >"$ssh_dir/mutsu_key"
          chmod 600 "$ssh_dir/mutsu_key"
          ssh-keygen -y -f "$ssh_dir/mutsu_key" >/dev/null

          host_key="$(mktemp "$ssh_dir/host-key.XXXXXX")"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -t ed25519 10.0.42.41 >"$host_key" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          test -s "$host_key"
          fingerprint="$(ssh-keygen -lf "$host_key" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:5g0PgPko1v4soAco1TrwF7uLOMoctLuNKTwGt29PTFk"
          cat "$host_key" >"$ssh_dir/known_hosts"
          rm -f "$host_key"
          chmod 600 "$ssh_dir/known_hosts"

          cat >"$ssh_dir/config" <<SSH_CONFIG
          Host mutsu-sidecar
            HostName 10.0.42.41
            User manitcor
            IdentityFile $ssh_dir/mutsu_key
            IdentitiesOnly yes
            UserKnownHostsFile $ssh_dir/known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          SSH_CONFIG
          chmod 600 "$ssh_dir/config"

      - name: Build native Linux aarch64 sidecar on mutsu
        shell: bash
        run: |
          set -euo pipefail
          output="/Volumes/build/tmp/matric-api-aarch64-unknown-linux-gnu-${GITHUB_RUN_ID}"
          repository="https://git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          ssh_config="${RUNNER_TEMP:?}/fortemi-mutsu-${GITHUB_RUN_ID}-linux-arm64/config"

          ssh -F "$ssh_config" mutsu-sidecar bash -s -- \
            "$repository" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" \
            "$output" <<'REMOTE_SCRIPT'
          set -euo pipefail
          repository="$1"
          revision="$2"
          version="$3"
          run_id="$4"
          output="$5"
          container="fortemi-sidecar-linux-arm64-${run_id}"
          source_dir="/Volumes/build/fortemi/builds/sidecar-linux-arm64-${run_id}"
          docker_config="/Volumes/build/tmp/sidecar-linux-arm64-docker-${run_id}"
          legacy_colima_profile="fortemi-linux-arm64"
          legacy_colima_home="${HOME}/.colima"
          colima_profile="fortemi-sidecar-linux-arm64"
          colima_home="/Volumes/build/fortemi/colima"
          colima_cache_home="/Volumes/build/fortemi/colima-cache"
          colima_tmp="/Volumes/build/tmp/sidecar-colima-${run_id}"
          colima_socket="${colima_home}/${colima_profile}/docker.sock"

          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          export COLIMA_HOME="$colima_home"
          export COLIMA_CACHE_HOME="$colima_cache_home"
          export TMPDIR="$colima_tmp"
          export DOCKER_CONFIG="$docker_config"
          export DOCKER_HOST="unix://${colima_socket}"
          mkdir -p \
            "$COLIMA_HOME" "$COLIMA_CACHE_HOME" "$TMPDIR" \
            "$DOCKER_CONFIG" "$(dirname "$source_dir")"
          printf '{"auths":{}}\n' >"$DOCKER_CONFIG/config.json"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            colima delete "$colima_profile" --force >/dev/null 2>&1 || true
            rm -rf "$source_dir" "$DOCKER_CONFIG" "$TMPDIR"
          }
          trap cleanup EXIT INT TERM

          command -v colima >/dev/null
          COLIMA_HOME="$legacy_colima_home" \
            colima delete "$legacy_colima_profile" --force >/dev/null 2>&1 || true
          colima delete "$colima_profile" --force >/dev/null 2>&1 || true
          colima start "$colima_profile" \
            --arch aarch64 --cpu 6 --memory 12 --disk 100
          case "$(docker info --format '{{.Architecture}}')" in
            aarch64 | arm64) ;;
            *) echo "Colima Docker daemon is not native Linux arm64" >&2; exit 1 ;;
          esac
          rm -f "$output"
          rm -rf "$source_dir"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin "$repository"
          git -c credential.helper= -c credential.interactive=never \
            -C "$source_dir" fetch --quiet --no-tags --depth=1 \
            origin "$revision"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"

          docker run -d --name "$container" --platform linux/arm64 \
            -e MATRIC_VERSION="$version" \
            -e MATRIC_GIT_SHA="$revision" \
            -e MATRIC_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            rust:1.92-bookworm@sha256:e90e846de4124376164ddfbaab4b0774c7bdeef5e738866295e5a90a34a307a2 \
            sleep infinity
          docker cp "$source_dir/." "$container:/build"
          docker exec "$container" \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                ca-certificates git libpq-dev libssl-dev pkg-config
              git config --global --add safe.directory /build
              test "$(git -C /build rev-parse HEAD)" = "$MATRIC_GIT_SHA"
              cd /build
              cargo build --release --package matric-api
            '
          docker cp "$container:/build/target/release/matric-api" "$output"
          chmod +x "$output"
          file "$output"
          shasum -a 256 "$output"
          REMOTE_SCRIPT

          scp -F "$ssh_config" \
            "mutsu-sidecar:${output}" matric-api-aarch64-unknown-linux-gnu
          ssh -F "$ssh_config" mutsu-sidecar rm -f "$output"
          chmod +x matric-api-aarch64-unknown-linux-gnu
          file matric-api-aarch64-unknown-linux-gnu
          sha256sum matric-api-aarch64-unknown-linux-gnu

      - name: Cleanup mutsu credential
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP:?}/fortemi-mutsu-${GITHUB_RUN_ID}-linux-arm64"
          ci/vault-fetch.sh --cleanup

      - name: Upload Linux aarch64 artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5  # v3
        with:
          name: matric-api-aarch64-unknown-linux-gnu
          path: matric-api-aarch64-unknown-linux-gnu

  # ─── macOS aarch64 (mutsu runner) ─────────────────────────────────────
  # macOS aarch64 build — hybrid via SSH to mutsu (M4 Mac mini).
  #
  # Historical note: this used `runs-on: mutsu` (native act_runner on the
  # Mac). That path has persistently failed task-fetch via gRPC due to
  # a reverse-proxy issue, causing every sidecar release since 54a2304
  # (2026-04-14) to be cancelled mid-build. Switched to the SSH-from-
  # ubuntu pattern below, which works reliably.
  build-macos:
    name: Build macOS aarch64
    runs-on: titan
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Fetch mutsu SSH key from vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.mutsu.spec

      - name: Set up SSH to mutsu
        shell: bash
        run: |
          set -euo pipefail
          test -s "${MUTSU_SSH_KEY_FILE:?MUTSU_SSH_KEY_FILE is required}"
          ssh_dir="${RUNNER_TEMP:?}/fortemi-mutsu-${GITHUB_RUN_ID}-macos"
          install -d -m 700 "$ssh_dir"

          # Write the key via printf (not echo) so we control the trailing
          # newline. Gitea/GitHub secret paste commonly strips the trailing
          # \n and/or introduces CRLF line endings — openssl's parser rejects
          # both with "error in libcrypto". We strip CRLF and ensure the file
          # ends with a single LF.
          tr -d '\r' <"$MUTSU_SSH_KEY_FILE" >"$ssh_dir/mutsu_key"
          chmod 600 "$ssh_dir/mutsu_key"

          # Sanity check: the key file must start with -----BEGIN and end
          # with -----END...PRIVATE KEY-----. Fail loud if not, so a bad
          # secret gets an actionable error instead of a cryptic libcrypto.
          if ! head -1 "$ssh_dir/mutsu_key" | grep -q "^-----BEGIN.*PRIVATE KEY-----$"; then
            echo "ERROR: MUTSU_SSH_KEY secret doesn't look like a PEM private key."
            echo "First line: $(head -1 "$ssh_dir/mutsu_key")"
            echo "Fix: re-paste the FULL key including -----BEGIN/-----END envelope."
            exit 1
          fi
          if ! tail -1 "$ssh_dir/mutsu_key" | grep -q "^-----END.*PRIVATE KEY-----$"; then
            echo "ERROR: MUTSU_SSH_KEY secret doesn't end with -----END line."
            echo "Last line: $(tail -1 "$ssh_dir/mutsu_key")"
            exit 1
          fi

          # Self-validate — ssh-keygen can sanity-check the key format
          # without connecting anywhere. This catches bad paste before we
          # burn a connection attempt.
          if ! ssh-keygen -y -f "$ssh_dir/mutsu_key" >/dev/null 2>&1; then
            echo "ERROR: MUTSU_SSH_KEY parses as invalid. ssh-keygen says:"
            ssh-keygen -y -f "$ssh_dir/mutsu_key" 2>&1 || true
            exit 1
          fi
          echo "SSH key format validated."

          host_key="$(mktemp "$ssh_dir/host-key.XXXXXX")"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -t ed25519 10.0.42.41 >"$host_key" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          test -s "$host_key"
          fingerprint="$(ssh-keygen -lf "$host_key" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:5g0PgPko1v4soAco1TrwF7uLOMoctLuNKTwGt29PTFk"
          cat "$host_key" >"$ssh_dir/known_hosts"
          rm -f "$host_key"
          chmod 600 "$ssh_dir/known_hosts"

          cat >"$ssh_dir/config" <<SSH_CONFIG
          Host mutsu-sidecar
            HostName 10.0.42.41
            User manitcor
            IdentityFile $ssh_dir/mutsu_key
            IdentitiesOnly yes
            UserKnownHostsFile $ssh_dir/known_hosts
            StrictHostKeyChecking yes
          SSH_CONFIG
          chmod 600 "$ssh_dir/config"

      - name: Build on mutsu via SSH
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="https://git.integrolabs.net/${{ github.repository }}.git"
          SHA="${GITHUB_SHA}"
          RUN_ID="${GITHUB_RUN_ID:-$$}"
          BUILD_DIR="/Volumes/build/fortemi/builds/sidecar-${RUN_ID}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SSH_CONFIG="${RUNNER_TEMP:?}/fortemi-mutsu-${RUN_ID}-macos/config"
          LOCAL_OUTPUT="${RUNNER_TEMP}/fortemi-sidecar-macos-${RUN_ID}"

          echo "=== macOS sidecar build on mutsu ==="
          echo "SHA:    ${SHA}"
          echo "Dir:    ${BUILD_DIR}"

          ssh -F "$SSH_CONFIG" mutsu-sidecar bash -s << REMOTE_SCRIPT
          set -euo pipefail

          # Environment — mutsu's Rust toolchain lives on the build volume
          export PATH="/Volumes/build/bt6/cargo/bin:/opt/homebrew/bin:/opt/homebrew/sbin:\$PATH"
          export CARGO_HOME="/Volumes/build/bt6/cargo"
          export RUSTUP_HOME="/Volumes/build/bt6/cargo/rustup"
          . /Volumes/build/bt6/cargo/env 2>/dev/null || true

          # Build temp on the external drive. The internal SSD is space-
          # constrained; the default TMPDIR (/var/folders/... on /) fills up
          # and clang fails with "unable to make temporary file: No space
          # left on device". Pin TMPDIR (and staging, below) to /Volumes/build.
          export TMPDIR="/Volumes/build/tmp"
          mkdir -p /Volumes/build/tmp

          # Fresh exact-SHA checkout per run so concurrent builds
          # don't interfere
          mkdir -p "${BUILD_DIR}"
          cd "${BUILD_DIR}"
          git init -q .
          git remote add origin "${REPO_URL}"
          git fetch --quiet --no-tags --depth=1 origin "${SHA:?SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

          echo "rustc: \$(rustc --version)"
          echo "cargo: \$(cargo --version)"

          # Ensure both Rust std targets are present. Idempotent — rustup
          # is a no-op if the components are already installed. Protects
          # against re-provisioned hosts or auto-pruned toolchains.
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

          # Build matric-api for both macOS architectures so downstream
          # consumers (BT6 Arsenal Desktop) can lipo into a universal
          # Tauri sidecar. x86_64-apple-darwin is cross-compiled from the
          # aarch64 host using the rust-std component for that target.
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            echo ""
            echo "=== Building matric-api for \${TARGET} ==="
            MATRIC_VERSION="${GITHUB_REF_NAME}" \
            MATRIC_GIT_SHA="${SHA}" \
            MATRIC_BUILD_DATE="${BUILD_DATE}" \
              cargo build --release --target "\${TARGET}" --package matric-api

            cp "target/\${TARGET}/release/matric-api" "matric-api-\${TARGET}"
            chmod +x "matric-api-\${TARGET}"
          done

          # Stage for scp pickup — also on the external drive (see TMPDIR note)
          mkdir -p /Volumes/build/tmp/fortemi-sidecar-out
          cp matric-api-aarch64-apple-darwin matric-api-x86_64-apple-darwin /Volumes/build/tmp/fortemi-sidecar-out/

          echo ""
          echo "=== Built binaries ==="
          for BIN in matric-api-aarch64-apple-darwin matric-api-x86_64-apple-darwin; do
            file "/Volumes/build/tmp/fortemi-sidecar-out/\${BIN}"
            ls -lh "/Volumes/build/tmp/fortemi-sidecar-out/\${BIN}"
            shasum -a 256 "/Volumes/build/tmp/fortemi-sidecar-out/\${BIN}"
          done

          # Prune old per-run build dirs so the external drive does not fill.
          # Keep the 5 most recent sidecar-* trees; remove the rest. Bounded,
          # glob-scoped to the build scratch path only.
          ls -dt /Volumes/build/fortemi/builds/sidecar-* 2>/dev/null | tail -n +6 | xargs rm -rf || true
          REMOTE_SCRIPT

          # Pull binaries back to the ubuntu runner for upload-artifact
          mkdir -p "$LOCAL_OUTPUT"
          scp -F "$SSH_CONFIG" \
            "mutsu-sidecar:/Volumes/build/tmp/fortemi-sidecar-out/matric-api-aarch64-apple-darwin" \
            "mutsu-sidecar:/Volumes/build/tmp/fortemi-sidecar-out/matric-api-x86_64-apple-darwin" \
            "$LOCAL_OUTPUT/"
          ls -lh "$LOCAL_OUTPUT/"

          # Copy to working dir so upload-artifact picks them up
          cp "$LOCAL_OUTPUT/matric-api-aarch64-apple-darwin" ./matric-api-aarch64-apple-darwin
          cp "$LOCAL_OUTPUT/matric-api-x86_64-apple-darwin" ./matric-api-x86_64-apple-darwin

      - name: Cleanup mutsu SSH key
        if: always()
        run: |
          rm -rf \
            "${RUNNER_TEMP:?}/fortemi-mutsu-${GITHUB_RUN_ID}-macos" \
            "${RUNNER_TEMP}/fortemi-sidecar-macos-${GITHUB_RUN_ID}"
          ci/vault-fetch.sh --cleanup

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5  # v3
        with:
          name: matric-api-aarch64-apple-darwin
          path: matric-api-aarch64-apple-darwin

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5  # v3
        with:
          name: matric-api-x86_64-apple-darwin
          path: matric-api-x86_64-apple-darwin

  # ─── Publish to rolling sidecar-latest release ──────────────────────────
  publish-sidecar-latest:
    name: Publish immutable sidecar and latest pointer
    runs-on: matric-builder
    needs: [build-linux, build-linux-arm64, build-macos]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download artifacts
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a  # v3
        with:
          path: artifacts/

      - name: Prepare sidecar publication
        run: |
          set -euo pipefail
          cp artifacts/matric-api-x86_64-unknown-linux-gnu/matric-api-x86_64-unknown-linux-gnu .
          cp artifacts/matric-api-aarch64-unknown-linux-gnu/matric-api-aarch64-unknown-linux-gnu .
          cp artifacts/matric-api-aarch64-apple-darwin/matric-api-aarch64-apple-darwin .
          cp artifacts/matric-api-x86_64-apple-darwin/matric-api-x86_64-apple-darwin .
          chmod +x matric-api-*

          echo "=== Binaries to publish ==="
          ls -lh matric-api-*
          sha256sum matric-api-*

      - name: Publish immutable sidecar identity
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-sidecar-release.sh immutable

      - name: Update rolling discovery pointer
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-sidecar-release.sh rolling

  # ─── Attach binaries to versioned release ───────────────────────────────
  publish-versioned:
    name: Publish to Versioned Release
    runs-on: matric-builder
    needs: [build-linux, build-linux-arm64, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download artifacts
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a  # v3
        with:
          path: artifacts/

      - name: Attach to versioned release
        run: |
          set -e
          TOKEN="${{ github.token }}"
          API="${GITEA_API}/repos/${REPO}"
          TAG="${GITHUB_REF_NAME}"

          # Move binaries to working directory
          cp artifacts/matric-api-x86_64-unknown-linux-gnu/matric-api-x86_64-unknown-linux-gnu .
          cp artifacts/matric-api-aarch64-unknown-linux-gnu/matric-api-aarch64-unknown-linux-gnu .
          cp artifacts/matric-api-aarch64-apple-darwin/matric-api-aarch64-apple-darwin .
          cp artifacts/matric-api-x86_64-apple-darwin/matric-api-x86_64-apple-darwin .
          chmod +x matric-api-*

          GITEA_TOKEN="${{ github.token }}" \
            scripts/ci/publish-sidecar-release.sh prepare

          echo "=== Binaries to publish for ${TAG} ==="
          ls -lh matric-api-*
          cat SHA256SUMS.txt

          # Wait for the versioned release to exist (created by ci-builder.yaml)
          echo "Waiting for release ${TAG} to be created by CI pipeline..."
          RELEASE_ID=""
          for i in {1..30}; do
            RESPONSE=$(curl -sf -H "Authorization: token ${TOKEN}" \
              "${API}/releases/tags/${TAG}" 2>/dev/null || true)

            if [ -n "${RESPONSE}" ] && echo "${RESPONSE}" | jq -e '.id' >/dev/null 2>&1; then
              RELEASE_ID=$(echo "${RESPONSE}" | jq -r '.id')
              echo "Found release ${TAG}: id=${RELEASE_ID}"
              break
            fi

            echo "Release not found yet, waiting... ($i/30)"
            sleep 10
          done

          # If release doesn't exist after waiting, create it. Pull body
          # from CHANGELOG.md so we don't ship boilerplate when this path
          # wins the race against ci-builder.yaml's create-release job.
          if [ -z "${RELEASE_ID}" ]; then
            echo "Release ${TAG} not found, creating..."
            VERSION="${TAG#v}"
            awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" \
              CHANGELOG.md > release_notes.md || true
            if [ ! -s release_notes.md ]; then
              echo "Release ${TAG} (changelog section missing — see CHANGELOG.md)" \
                > release_notes.md
            fi
            RELEASE_RESPONSE=$(curl -sf -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              "${API}/releases" \
              -d "{
                \"tag_name\": \"${TAG}\",
                \"name\": \"${TAG}\",
                \"body\": $(cat release_notes.md | jq -Rs .),
                \"draft\": false,
                \"prerelease\": false
              }")
            RELEASE_ID=$(echo "${RELEASE_RESPONSE}" | jq -r '.id')
            echo "Created release: id=${RELEASE_ID}"
          fi

          # Upload binaries as release assets
          for BINARY in matric-api-x86_64-unknown-linux-gnu matric-api-aarch64-unknown-linux-gnu matric-api-aarch64-apple-darwin matric-api-x86_64-apple-darwin; do
            echo "Uploading ${BINARY}..."
            curl -sf -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              "${API}/releases/${RELEASE_ID}/assets?name=${BINARY}" \
              --data-binary @"${BINARY}"
            echo "  Uploaded ${BINARY}"
          done

          # Upload checksums
          curl -sf -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: text/plain" \
            "${API}/releases/${RELEASE_ID}/assets?name=SHA256SUMS.txt" \
            --data-binary @SHA256SUMS.txt
          echo "  Uploaded SHA256SUMS.txt"

          curl -sf -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            "${API}/releases/${RELEASE_ID}/assets?name=sidecar-provenance.intoto.json" \
            --data-binary @sidecar-provenance.intoto.json
          echo "  Uploaded sidecar-provenance.intoto.json"

          echo ""
          echo "=== Published sidecar binaries to ${TAG} ==="
          echo "  https://git.integrolabs.net/${REPO}/releases/tag/${TAG}"

          # Also update sidecar-latest to point to this release
          echo ""
          echo "Updating sidecar-latest to match ${TAG}..."

          # Delete existing sidecar-latest release
          EXISTING=$(curl -sf -H "Authorization: token ${TOKEN}" \
            "${API}/releases/tags/sidecar-latest" 2>/dev/null || true)

          if [ -n "${EXISTING}" ] && echo "${EXISTING}" | jq -e '.id' >/dev/null 2>&1; then
            OLD_ID=$(echo "${EXISTING}" | jq -r '.id')
            curl -sf -X DELETE \
              -H "Authorization: token ${TOKEN}" \
              "${API}/releases/${OLD_ID}"
          fi

          curl -sf -X DELETE \
            -H "Authorization: token ${TOKEN}" \
            "${API}/tags/sidecar-latest" 2>/dev/null || true

          VERSION="${TAG#v}"
          RELEASE_BODY="Rolling sidecar binaries — currently tracking ${TAG}.

          Download and use as a native sidecar:
          \`\`\`bash
          # Linux x86_64
          curl -LO https://git.integrolabs.net/${REPO}/releases/download/sidecar-latest/matric-api-x86_64-unknown-linux-gnu
          chmod +x matric-api-x86_64-unknown-linux-gnu

          # Linux arm64
          curl -LO https://git.integrolabs.net/${REPO}/releases/download/sidecar-latest/matric-api-aarch64-unknown-linux-gnu
          chmod +x matric-api-aarch64-unknown-linux-gnu

          # macOS Apple Silicon (M1+)
          curl -LO https://git.integrolabs.net/${REPO}/releases/download/sidecar-latest/matric-api-aarch64-apple-darwin
          chmod +x matric-api-aarch64-apple-darwin

          # macOS Intel
          curl -LO https://git.integrolabs.net/${REPO}/releases/download/sidecar-latest/matric-api-x86_64-apple-darwin
          chmod +x matric-api-x86_64-apple-darwin
          \`\`\`

          Tracking release: ${TAG}
          Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          LATEST_RESPONSE=$(curl -sf -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/releases" \
            -d "{
              \"tag_name\": \"sidecar-latest\",
              \"target_commitish\": \"${GITHUB_SHA}\",
              \"name\": \"Sidecar Binaries (latest)\",
              \"body\": $(echo "${RELEASE_BODY}" | jq -Rs .),
              \"draft\": false,
              \"prerelease\": true
            }")

          LATEST_ID=$(echo "${LATEST_RESPONSE}" | jq -r '.id')

          for BINARY in matric-api-x86_64-unknown-linux-gnu matric-api-aarch64-unknown-linux-gnu matric-api-aarch64-apple-darwin matric-api-x86_64-apple-darwin; do
            curl -sf -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              "${API}/releases/${LATEST_ID}/assets?name=${BINARY}" \
              --data-binary @"${BINARY}"
          done

          curl -sf -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: text/plain" \
            "${API}/releases/${LATEST_ID}/assets?name=SHA256SUMS.txt" \
            --data-binary @SHA256SUMS.txt

          echo "  sidecar-latest updated to ${TAG}"
