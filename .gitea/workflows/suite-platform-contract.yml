name: Suite Platform Contract

on:
  workflow_dispatch: {}

concurrency:
  group: fortemi-shared-runner
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}
  MUTSU_SSH_KEY_VAULT_PATH: ${{ vars.MUTSU_SSH_KEY_VAULT_PATH }}
  MUTSU_SSH_KEY_VAULT_FIELD: ${{ vars.MUTSU_SSH_KEY_VAULT_FIELD }}
  BUILD_REPO_TOKEN_VAULT_PATH: ${{ vars.BUILD_REPO_TOKEN_VAULT_PATH }}
  BUILD_REPO_TOKEN_VAULT_FIELD: ${{ vars.BUILD_REPO_TOKEN_VAULT_FIELD }}
  VAULT_CACERT: ${{ github.workspace }}/ci/trust/integro-labs-root-ca-g2.crt
  VAULT_SKIP_VERIFY: "0"

jobs:
  linux-x86_64:
    name: Linux x86_64 authority-to-consumer contract
    runs-on: matric-builder
    timeout-minutes: 180
    steps:
      - name: Checkout exact orchestrator revision
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA:?GITHUB_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check free bytes and inodes
        env:
          RUNNER_MIN_FREE_KIB: ${{ vars.RUNNER_MIN_FREE_KIB }}
          RUNNER_MIN_FREE_INODES: ${{ vars.RUNNER_MIN_FREE_INODES }}
        run: bash scripts/ci/check-runner-capacity.sh

      - name: Test mutsu build serialization guard
        run: |
          bash tests/test_mutsu_build_lock.sh
          bash scripts/ci/verify-mutsu-build-serialization.sh

      - name: Execute complete headless platform contract
        run: |
          set -euo pipefail
          scripts/ci/run-suite-platform-contract.sh \
            "$PWD/suite-platform-output/linux-x86_64"

      - name: Upload Linux receipt bundle
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: suite-platform-linux-x86_64
          path: suite-platform-output/linux-x86_64

  linux-arm64:
    name: mutsu Linux arm64 authority-to-consumer contract
    runs-on: ubuntu-22.04
    needs: [linux-x86_64]
    timeout-minutes: 240
    steps:
      - name: Checkout coordinator tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch mutsu SSH key from Vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.mutsu.spec

      - name: Configure pinned mutsu host identity
        run: |
          set -euo pipefail
          test -s "${MUTSU_SSH_KEY_FILE:?MUTSU_SSH_KEY_FILE is required}"
          install -d -m 700 "$HOME/.ssh"
          tr -d '\r' <"$MUTSU_SSH_KEY_FILE" >"$HOME/.ssh/mutsu_key"
          chmod 600 "$HOME/.ssh/mutsu_key"
          ssh-keygen -y -f "$HOME/.ssh/mutsu_key" >/dev/null

          host_key="$(mktemp)"
          ssh-keyscan -t ed25519 10.0.42.41 >"$host_key" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$host_key" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:5g0PgPko1v4soAco1TrwF7uLOMoctLuNKTwGt29PTFk"
          cat "$host_key" >"$HOME/.ssh/known_hosts"
          rm -f "$host_key"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat >"$HOME/.ssh/config" <<'SSH_CONFIG'
          Host mutsu-suite
            HostName 10.0.42.41
            User manitcor
            IdentityFile ~/.ssh/mutsu_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            PreferredAuthentications publickey
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            ServerAliveInterval 30
            ServerAliveCountMax 20
          SSH_CONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Execute complete headless contract in native Linux arm64
        shell: bash
        run: |
          set -euo pipefail
          build_dir="/Volumes/build/fortemi/builds/suite-linux-arm64-${GITHUB_RUN_ID}"
          source_root="/Volumes/build/fortemi/builds/suite-linux-arm64-sources-${GITHUB_RUN_ID}"
          output_root="/Volumes/build/tmp/suite-linux-arm64-out-${GITHUB_RUN_ID}"
          output_tar="/Volumes/build/tmp/suite-linux-arm64-${GITHUB_RUN_ID}.tar.gz"
          repo_url="https://git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          lock_helper="/Volumes/build/tmp/mutsu-build-lock-suite-linux-${GITHUB_RUN_ID}.sh"
          scp scripts/ci/mutsu-build-lock.sh "mutsu-suite:${lock_helper}"

          remote_status=0
          ssh mutsu-suite bash "$lock_helper" \
            --label "Fortemi-suite-Linux-arm64-${GITHUB_RUN_ID}" \
            --timeout 3600 \
            -- bash -s -- \
            "$build_dir" "$source_root" "$output_root" "$output_tar" \
            "$repo_url" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            <<'REMOTE_SCRIPT' || remote_status=$?
          set -euo pipefail
          build_dir="$1"
          source_root="$2"
          output_root="$3"
          output_tar="$4"
          repo_url="$5"
          revision="$6"
          run_id="$7"
          container="fortemi-suite-linux-arm64-${run_id}"
          image="fortemi-suite-builder-linux-arm64:${revision}"
          db_container="fortemi-suite-db-linux-arm64-${run_id}"
          db_image="fortemi-suite-testdb-linux-arm64:${revision}"
          network="fortemi-suite-linux-arm64-${run_id}"
          docker_config="/Volumes/build/tmp/suite-linux-arm64-docker-${run_id}"
          legacy_colima_profile="fortemi-linux-arm64"
          legacy_colima_home="${HOME}/.colima"
          colima_profile="fortemi-suite-linux-arm64"
          colima_home="/Volumes/build/fortemi/colima"
          colima_cache_home="/Volumes/build/fortemi/colima-cache"
          colima_tmp="/Volumes/build/tmp/colima-${run_id}"
          colima_socket="${colima_home}/${colima_profile}/docker.sock"

          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          export COLIMA_HOME="$colima_home"
          export COLIMA_CACHE_HOME="$colima_cache_home"
          export TMPDIR="$colima_tmp"
          export DOCKER_CONFIG="$docker_config"
          export DOCKER_HOST="unix://${colima_socket}"
          mkdir -p \
            "$COLIMA_HOME" "$COLIMA_CACHE_HOME" "$TMPDIR" \
            "$DOCKER_CONFIG" "$(dirname "$build_dir")"
          printf '{"auths":{}}\n' >"$DOCKER_CONFIG/config.json"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker rm -f "$db_container" >/dev/null 2>&1 || true
            docker image rm -f "$db_image" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            colima delete "$colima_profile" --force >/dev/null 2>&1 || true
            rm -rf \
              "$build_dir" "$source_root" "$output_root" \
              "$DOCKER_CONFIG" "$TMPDIR"
          }
          trap cleanup EXIT INT TERM

          command -v colima >/dev/null
          COLIMA_HOME="$legacy_colima_home" \
            colima delete "$legacy_colima_profile" --force >/dev/null 2>&1 || true
          colima delete "$colima_profile" --force >/dev/null 2>&1 || true
          colima start "$colima_profile" \
            --arch aarch64 --cpu 6 --memory 12 --disk 100
          case "$(docker info --format '{{.Architecture}}')" in
            aarch64 | arm64) ;;
            *) echo "Colima Docker daemon is not native Linux arm64" >&2; exit 1 ;;
          esac

          rm -rf "$build_dir" "$source_root" "$output_root"
          rm -f "$output_tar"
          git init -q "$build_dir"
          git -C "$build_dir" remote add origin "$repo_url"
          git -c credential.helper= -c credential.interactive=never \
            -C "$build_dir" fetch --quiet --no-tags --depth=1 origin "$revision"
          git -C "$build_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$build_dir" rev-parse HEAD)" = "$revision"

          matrix="$build_dir/contracts/suite-conformance/platform-matrix.json"
          matrix_value() {
            python3 - "$matrix" "$1" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          for segment in sys.argv[2].split("."):
              value = value[segment]
          print(value)
          PY
          }
          stage_repository() {
            local repository="$1"
            local commit="$2"
            local destination="$3"
            mkdir -p "$(dirname "$destination")"
            git init -q "$destination"
            git -C "$destination" remote add origin \
              "https://git.integrolabs.net/${repository}.git"
            git -c credential.helper= -c credential.interactive=never \
              -C "$destination" fetch --quiet --no-tags --depth=1 origin "$commit"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
            git -C "$destination" update-ref refs/heads/suite-pinned "$commit"
            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
            test -z "$(git -C "$destination" status --porcelain)"
          }

          authority_repository="$(matrix_value authority.repository)"
          authority_runtime="$(matrix_value authority.runtime_commit)"
          authority_schema="$(matrix_value authority.schema_commit)"
          react_repository="$(matrix_value participants.fortemi_react.repository)"
          react_commit="$(matrix_value participants.fortemi_react.commit)"
          hotm_repository="$(matrix_value participants.hotm.repository)"
          hotm_commit="$(matrix_value participants.hotm.commit)"
          authority_source="$source_root/$authority_repository"
          hotm_source="$source_root/$hotm_repository"
          stage_repository \
            "$authority_repository" "$authority_runtime" "$authority_source"
          git -c credential.helper= -c credential.interactive=never \
            -C "$authority_source" fetch --quiet --no-tags --depth=1 \
            origin "$authority_schema"
          git -C "$authority_source" update-ref \
            refs/heads/suite-schema "$authority_schema"
          stage_repository \
            "$react_repository" "$react_commit" "$source_root/$react_repository"
          stage_repository "$hotm_repository" "$hotm_commit" "$hotm_source"

          sidecar_target="aarch64-unknown-linux-gnu"
          sidecar_asset="$(python3 - "$hotm_source" "$sidecar_target" <<'PY'
          import json
          import sys

          root, target = sys.argv[1:]
          manifest = json.load(open(
              f"{root}/release/live-asset-receipt-sidecar-provenance.json",
              encoding="utf-8",
          ))
          print(manifest["assets"][target]["asset_name"])
          PY
          )"
          sidecar_url="$(python3 - "$hotm_source" "$sidecar_target" <<'PY'
          import json
          import sys

          root, target = sys.argv[1:]
          manifest = json.load(open(
              f"{root}/release/live-asset-receipt-sidecar-provenance.json",
              encoding="utf-8",
          ))
          print(f'{manifest["base_url"].rstrip("/")}/{manifest["assets"][target]["asset_name"]}')
          PY
          )"
          expected_sidecar_sha="$(
            matrix_value participants.hotm.sidecar_assets.linux-arm64
          )"
          provenance_sidecar_sha="$(python3 - "$hotm_source" "$sidecar_target" <<'PY'
          import json
          import sys

          root, target = sys.argv[1:]
          manifest = json.load(open(
              f"{root}/release/live-asset-receipt-sidecar-provenance.json",
              encoding="utf-8",
          ))
          print(manifest["assets"][target]["sha256"])
          PY
          )"
          test "$provenance_sidecar_sha" = "$expected_sidecar_sha"
          mkdir -p "$source_root/sidecar"
          curl -fsSL --retry 3 "$sidecar_url" \
            -o "$source_root/sidecar/$sidecar_asset"
          actual_sidecar_sha="$(
            shasum -a 256 "$source_root/sidecar/$sidecar_asset" | awk '{print $1}'
          )"
          test "$actual_sidecar_sha" = "$expected_sidecar_sha"

          docker build --platform linux/arm64 \
            -f "$build_dir/build/Dockerfile.builder" \
            -t "$image" "$build_dir"

          db_password="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          docker build --platform linux/arm64 \
            -f "$build_dir/build/Dockerfile.testdb" \
            -t "$db_image" "$build_dir"
          docker network create "$network" >/dev/null
          docker run -d --name "$db_container" --platform linux/arm64 \
            --network "$network" \
            -e POSTGRES_USER=matric \
            -e "POSTGRES_PASSWORD=${db_password}" \
            -e POSTGRES_DB=matric_suite \
            "$db_image" >/dev/null
          db_ready=false
          for _ in $(seq 1 60); do
            if docker exec "$db_container" pg_isready \
              -h 127.0.0.1 -p 5432 -U matric -d matric_suite \
              >/dev/null 2>&1; then
              db_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$db_ready" != "true" ]]; then
            docker logs "$db_container" >&2
            exit 1
          fi
          db_architecture="$(
            docker image inspect "$db_image" --format '{{.Architecture}}'
          )"
          db_version="$(
            docker exec "$db_container" postgres --version |
              sed 's/^postgres (PostgreSQL) //'
          )"
          db_extensions="$(
            docker exec "$db_container" psql -At \
              -U matric -d matric_suite \
              -c "SELECT string_agg(extname, ',' ORDER BY extname)
                  FROM pg_extension"
          )"
          database_url="postgres://matric:${db_password}@${db_container}:5432/matric_suite"
          maintenance_url="postgres://matric:${db_password}@${db_container}:5432/postgres"

          run_status=0
          docker run -d --name "$container" --platform linux/arm64 \
            --network "$network" \
            -e GITHUB_RUN_ID="$run_id" \
            -e GIT_TERMINAL_PROMPT=0 \
            -e "SUITE_PLATFORM_MANAGED_DATABASE_URL=${database_url}" \
            -e "SUITE_PLATFORM_MANAGED_DATABASE_MAINTENANCE_URL=${maintenance_url}" \
            -e SUITE_PLATFORM_DATABASE_PROVISIONING=managed-docker \
            -e "SUITE_PLATFORM_DATABASE_ARCHITECTURE=${db_architecture}" \
            -e "SUITE_PLATFORM_DATABASE_VERSION=${db_version}" \
            -e "SUITE_PLATFORM_DATABASE_EXTENSIONS=${db_extensions}" \
            "$image" sleep infinity
          docker cp "$build_dir/." "$container:/suite"
          docker cp "$source_root/." "$container:/suite-inputs"
          docker exec "$container" bash -c '
              set -euo pipefail
              git config --global protocol.file.allow always
              git config --global --add safe.directory /suite
              git config --global --add safe.directory \
                /suite-inputs/Fortemi/fortemi
              git config --global --add safe.directory \
                /suite-inputs/Fortemi/fortemi/.git
              git config --global --add safe.directory \
                /suite-inputs/Fortemi/fortemi-react
              git config --global --add safe.directory \
                /suite-inputs/Fortemi/fortemi-react/.git
              git config --global --add safe.directory \
                /suite-inputs/Fortemi/HotM
              git config --global --add safe.directory \
                /suite-inputs/Fortemi/HotM/.git
              git config --global \
                url.file:///suite-inputs/Fortemi/fortemi.insteadOf \
                https://git.integrolabs.net/Fortemi/fortemi.git
              git config --global \
                url.file:///suite-inputs/Fortemi/fortemi-react.insteadOf \
                https://git.integrolabs.net/Fortemi/fortemi-react.git
              git config --global \
                url.file:///suite-inputs/Fortemi/HotM.insteadOf \
                https://git.integrolabs.net/Fortemi/HotM.git
              export SIDECAR_SOURCE_FILE=/suite-inputs/sidecar/matric-api-aarch64-unknown-linux-gnu
              test "$(git -C /suite rev-parse HEAD)" = "'"$revision"'"
              /suite/scripts/ci/run-suite-platform-contract.sh \
                /suite-platform-output/linux-arm64
            ' || run_status=$?

          mkdir -p "$output_root"
          if docker cp \
            "$container:/suite-platform-output/linux-arm64" "$output_root/"; then
            tar -C "$output_root" -czf "$output_tar" linux-arm64
          else
            run_status=1
          fi
          exit "$run_status"
          REMOTE_SCRIPT

          mkdir -p suite-platform-output
          if ssh mutsu-suite test -f "$output_tar"; then
            scp "mutsu-suite:${output_tar}" \
              suite-platform-output/linux-arm64.tar.gz
            tar -C suite-platform-output \
              -xzf suite-platform-output/linux-arm64.tar.gz
            rm suite-platform-output/linux-arm64.tar.gz
            ssh mutsu-suite rm -f "$output_tar"
          fi
          exit "$remote_status"

      - name: Cleanup mutsu credential
        if: always()
        run: |
          lock_helper="/Volumes/build/tmp/mutsu-build-lock-suite-linux-${GITHUB_RUN_ID}.sh"
          if [[ -f "$HOME/.ssh/config" ]]; then
            ssh mutsu-suite rm -f "$lock_helper" || true
          fi
          rm -f "$HOME/.ssh/mutsu_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ci/vault-fetch.sh --cleanup

      - name: Upload Linux arm64 receipt bundle
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: suite-platform-linux-arm64
          path: suite-platform-output/linux-arm64

  macos-arm64:
    name: mutsu macOS arm64 authority-to-consumer contract
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    needs: [linux-arm64]
    steps:
      - name: Checkout coordinator tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fetch mutsu SSH key from Vault
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.mutsu.spec

      - name: Configure pinned mutsu host identity
        run: |
          set -euo pipefail
          test -s "${MUTSU_SSH_KEY_FILE:?MUTSU_SSH_KEY_FILE is required}"
          install -d -m 700 "$HOME/.ssh"
          tr -d '\r' <"$MUTSU_SSH_KEY_FILE" >"$HOME/.ssh/mutsu_key"
          chmod 600 "$HOME/.ssh/mutsu_key"
          ssh-keygen -y -f "$HOME/.ssh/mutsu_key" >/dev/null

          host_key="$(mktemp)"
          ssh-keyscan -t ed25519 10.0.42.41 >"$host_key" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$host_key" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:5g0PgPko1v4soAco1TrwF7uLOMoctLuNKTwGt29PTFk"
          cat "$host_key" >"$HOME/.ssh/known_hosts"
          rm -f "$host_key"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat >"$HOME/.ssh/config" <<'SSH_CONFIG'
          Host mutsu-suite
            HostName 10.0.42.41
            User manitcor
            IdentityFile ~/.ssh/mutsu_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            PreferredAuthentications publickey
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            ServerAliveInterval 30
            ServerAliveCountMax 20
          SSH_CONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Execute complete headless contract natively on mutsu
        shell: bash
        run: |
          set -euo pipefail
          build_dir="/Volumes/build/fortemi/builds/suite-${GITHUB_RUN_ID}"
          output_tar="/Volumes/build/tmp/suite-${GITHUB_RUN_ID}.tar.gz"
          repo_url="https://git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          lock_helper="/Volumes/build/tmp/mutsu-build-lock-suite-macos-${GITHUB_RUN_ID}.sh"
          scp scripts/ci/mutsu-build-lock.sh "mutsu-suite:${lock_helper}"

          remote_status=0
          ssh mutsu-suite bash "$lock_helper" \
            --label "Fortemi-suite-macOS-arm64-${GITHUB_RUN_ID}" \
            --timeout 3600 \
            -- bash -s -- \
            "$build_dir" "$output_tar" "$repo_url" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" <<'REMOTE_SCRIPT' || remote_status=$?
          set -euo pipefail
          build_dir="$1"
          output_tar="$2"
          repo_url="$3"
          revision="$4"
          export GITHUB_RUN_ID="$5"

          export PATH="/Volumes/build/bt6/cargo/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          export CARGO_HOME="/Volumes/build/bt6/cargo"
          export RUSTUP_HOME="/Volumes/build/bt6/cargo/rustup"
          export TMPDIR="/Volumes/build/tmp"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=
          export GIT_TERMINAL_PROMPT=0
          mkdir -p "$TMPDIR" "$(dirname "$build_dir")"
          cleanup() {
            rm -rf "$build_dir"
          }
          trap cleanup EXIT INT TERM

          command -v brew
          command -v git
          command -v cargo
          if ! command -v node >/dev/null 2>&1 ||
            ! command -v npm >/dev/null 2>&1; then
            brew install node
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            brew install python
          fi
          printf 'node: %s\n' "$(node --version)"
          printf 'npm: %s\n' "$(npm --version)"
          printf 'pnpm: %s\n' "$(pnpm --version)"
          printf 'python: %s\n' "$(python3 --version)"
          printf 'cargo: %s\n' "$(cargo --version)"

          rm -rf "$build_dir" "$output_tar"
          git init -q "$build_dir"
          git -C "$build_dir" remote add origin "$repo_url"
          git -c credential.helper= -c credential.interactive=never \
            -C "$build_dir" fetch --no-tags --depth=1 origin "$revision"
          git -C "$build_dir" checkout --detach FETCH_HEAD
          actual_revision="$(git -C "$build_dir" rev-parse HEAD)"
          printf 'orchestrator: %s\n' "$actual_revision"
          test "$actual_revision" = "$revision"
          python3 -m venv "$build_dir/.venv"
          "$build_dir/.venv/bin/pip" install --quiet \
            --disable-pip-version-check jsonschema==4.25.1
          export PATH="$build_dir/.venv/bin:$PATH"

          run_status=0
          printf 'starting suite platform runner\n'
          "$build_dir/scripts/ci/run-suite-platform-contract.sh" \
            "$build_dir/suite-platform-output/macos-arm64" || run_status=$?
          if [[ -d "$build_dir/suite-platform-output/macos-arm64" ]]; then
            tar -C "$build_dir/suite-platform-output" \
              -czf "$output_tar" macos-arm64
          fi
          exit "$run_status"
          REMOTE_SCRIPT

          mkdir -p suite-platform-output
          if ssh mutsu-suite test -f "$output_tar"; then
            scp "mutsu-suite:${output_tar}" suite-platform-output/macos-arm64.tar.gz
            tar -C suite-platform-output \
              -xzf suite-platform-output/macos-arm64.tar.gz
            rm suite-platform-output/macos-arm64.tar.gz
            ssh mutsu-suite rm -f "$output_tar"
          fi
          exit "$remote_status"

      - name: Cleanup mutsu credential
        if: always()
        run: |
          lock_helper="/Volumes/build/tmp/mutsu-build-lock-suite-macos-${GITHUB_RUN_ID}.sh"
          if [[ -f "$HOME/.ssh/config" ]]; then
            ssh mutsu-suite rm -f "$lock_helper" || true
          fi
          rm -f "$HOME/.ssh/mutsu_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ci/vault-fetch.sh --cleanup

      - name: Upload macOS receipt bundle
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: suite-platform-macos-arm64
          path: suite-platform-output/macos-arm64

  aggregate:
    name: Required supported-platform aggregate
    runs-on: matric-builder
    timeout-minutes: 30
    needs: [linux-x86_64, linux-arm64, macos-arm64]
    steps:
      - name: Checkout exact verifier
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA:?GITHUB_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Check free bytes and inodes
        env:
          RUNNER_MIN_FREE_KIB: ${{ vars.RUNNER_MIN_FREE_KIB }}
          RUNNER_MIN_FREE_INODES: ${{ vars.RUNNER_MIN_FREE_INODES }}
        run: bash scripts/ci/check-runner-capacity.sh

      - name: Download platform receipts
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          path: suite-platform-artifacts

      - name: Verify exact supported-platform aggregate
        run: |
          set -euo pipefail
          linux_artifact="suite-platform-artifacts/suite-platform-linux-x86_64"
          linux_arm_artifact="suite-platform-artifacts/suite-platform-linux-arm64"
          macos_artifact="suite-platform-artifacts/suite-platform-macos-arm64"

          find_exact_file() {
            local artifact_root="$1"
            local filename="$2"
            local matches=()
            mapfile -t matches < <(
              find "$artifact_root" -type f -name "$filename" -print
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              printf 'expected one %s below %s; found %s\n' \
                "$filename" "$artifact_root" "${#matches[@]}" >&2
              return 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          linux_receipt="$(find_exact_file "$linux_artifact" platform-receipt.json)"
          linux_arm_receipt="$(
            find_exact_file "$linux_arm_artifact" platform-receipt.json
          )"
          macos_receipt="$(find_exact_file "$macos_artifact" platform-receipt.json)"
          linux_hotm="$(find_exact_file "$linux_artifact" hotm-receipt.json)"
          linux_arm_hotm="$(
            find_exact_file "$linux_arm_artifact" hotm-receipt.json
          )"
          macos_hotm="$(find_exact_file "$macos_artifact" hotm-receipt.json)"

          hotm_repository="$(
            python3 -c \
              'import json; print(json.load(open("contracts/suite-conformance/platform-matrix.json"))["participants"]["hotm"]["repository"])'
          )"
          hotm_commit="$(
            python3 -c \
              'import json; print(json.load(open("contracts/suite-conformance/platform-matrix.json"))["participants"]["hotm"]["commit"])'
          )"
          hotm_checkout="$(mktemp -d)"
          trap 'rm -rf "$hotm_checkout"' EXIT
          git init -q "$hotm_checkout"
          git -C "$hotm_checkout" remote add origin \
            "https://git.integrolabs.net/${hotm_repository}.git"
          git -C "$hotm_checkout" fetch --quiet --no-tags --depth=1 \
            origin "$hotm_commit"
          git -C "$hotm_checkout" checkout --quiet --detach FETCH_HEAD
          node "$hotm_checkout/ui/scripts/verify-live-asset-ci-receipt-matrix.cjs" \
            "$linux_hotm" "$linux_arm_hotm" "$macos_hotm" \
            --output hotm-platform-matrix.json

          python3 scripts/ci/verify-suite-platform-matrix.py aggregate \
            --platform-receipt "$linux_receipt" \
            --platform-receipt "$linux_arm_receipt" \
            --platform-receipt "$macos_receipt" \
            --output suite-platform-aggregate.json

      - name: Upload bounded aggregate receipt
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: suite-platform-supported-aggregate
          path: |
            suite-platform-aggregate.json
            hotm-platform-matrix.json

  handoff-docsite:
    name: Dispatch Documentation Deployment
    runs-on: matric-builder
    needs: [aggregate]
    if: github.event_name == 'workflow_dispatch' && needs.aggregate.result == 'success'
    steps:
      - name: Checkout dispatch tooling
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://git.integrolabs.net/${GITHUB_REPOSITORY}.git
          git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA:?GITHUB_SHA is required}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Fetch Gitea trigger token
        env:
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.gitea-release.spec

      - name: Dispatch documentation deployment at the verified ref
        run: |
          set -euo pipefail
          jq -n --arg ref "${GITHUB_REF:?GITHUB_REF is required}" \
            '{ref: $ref}' > dispatch.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: token ${BUILD_REPO_TOKEN:?BUILD_REPO_TOKEN is required}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://git.integrolabs.net/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/docsite-deploy.yml/dispatches" \
            --data-binary @dispatch.json

      - name: Cleanup trigger token
        if: always()
        run: ci/vault-fetch.sh --cleanup
